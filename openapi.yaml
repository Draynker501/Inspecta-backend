    patch:
      summary: Reordenar Secciones de una Versión
      description: |
        Requiere `checklists.manage` y una versión draft nunca publicada.

        Debe proporcionarse la lista completa de identificadores de las
        secciones pertenecientes a la versión, sin duplicados ni elementos
        ajenos.

        El orden del arreglo determina la nueva posición de cada sección.
        Las posiciones se asignan consecutivamente a partir de 1.

        La operación es transaccional y registra los cambios en auditoría.
        No se permiten parámetros de consulta ni campos adicionales.
      tags:
        - Checklists
      parameters:
        - $ref: '#/components/parameters/checklistVersionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - section_ids
              properties:
                section_ids:
                  type: array
                  uniqueItems: true
                  description: Identificadores de todas las secciones en el orden deseado.
                  items:
                    type: string
                    format: uuid
                  example:
                    - "018f2b3c-4d5e-7f8a-8000-112233445501"
                    - "018f2b3c-4d5e-7f8a-8000-112233445502"
                    - "018f2b3c-4d5e-7f8a-8000-112233445503"
      responses:
        '200':
          description: Secciones reordenadas correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChecklistSection'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
