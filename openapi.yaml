openapi: 3.0.3

info:
  title: Inspecta API
  description: |
    Contrato de API para el sistema Inspecta de gestión de inspecciones,
    incidencias, evidencias y acciones correctivas en plantas industriales.

    **Convenciones transversales:**

    - Todas las colecciones usan paginación con parámetros `page` y `per_page`
      (estándar Laravel API Resources) y devuelven el envelope `{data, meta}`.
    - El campo `status` es booleano: `true` = activo, `false` = inactivo.
      La baja lógica mediante `deleted_at` es independiente del estado `status`.
    - El token identifica al usuario autenticado; la organización activa de las
      rutas de dominio se selecciona con `X-Organization-Id` y membresía activa,
      no se deriva del token. Los campos de actor y organización de cada operación
      se rigen por su contrato; en POST /plants `organization_id` no se admite en el body.
    - Aislamiento multi-tenant: un recurso de otra organización se comporta como
      inexistente (404) cuando se consulta por identificador y no revela su existencia.
    - v1.4.0 (aditiva, M1.5): cabecera X-Organization-Id (UUID) obligatoria en rutas de dominio; GET /auth/organizations; campo type en Organization (client/operator); identidad global en /auth/me.
    - v2.0.0 (D-16, D-31b, D-31c): sobre de error uniforme `{ message, code, errors? }`
      con códigos estables del catálogo (ver components/schemas/ErrorCode).
      Regla transversal: el mismo código implica el mismo estado HTTP y el mismo
      texto de message. Los errores fuera del catálogo (403 de policies, 405,
      500) pueden omitir `code`.

    - Coordenadas con precisión de 7 decimales (BD `DECIMAL(10,7)`):
      latitud −90..90, longitud −180..180.

    **Flujo de sesión:** `POST /auth/login` → `GET /auth/organizations`
    (organizaciones cliente con membresía activa) → el cliente selecciona una
    organización y la envía como cabecera `X-Organization-Id` en cada petición
    con contexto de dominio. `GET /auth/me` devuelve solo la identidad global
    del usuario, sin depender de la organización seleccionada. Ante un
    `organization_access_denied` con una selección previa, el cliente debe
    volver a consultar `GET /auth/organizations` y pedir otra selección.

    **Decisión por código:** los clientes deben decidir por `code` y no por el
    texto de `message` (por ejemplo, `cross_tenant_operation` tiene dos textos
    posibles).

    - Los paths marcados con `x-status: planned` están diseñados pero aún no
      implementados en el servidor; mientras tanto devuelven `not_found`
      (404, código `not_found`). No deben considerarse disponibles para consumo.

  version: 2.3.0

servers:
  - url: https://api.inspecta.com/api
    description: Servidor de Producción
  - url: http://localhost:8000/api
    description: Servidor de Desarrollo Local

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Inicio y cierre de sesión, e identidad del usuario autenticado.
  - name: Organization
  - name: Users
  - name: Checklists
  - name: Norms
  - name: Inspections
  - name: Incidents
  - name: Evidences
  - name: Corrective Actions
  - name: Audit Logs
  - name: Sync

paths:

  # ===================================================================
  # AUTHENTICATION
  # ===================================================================

  /auth/login:
    post:
      summary: Iniciar sesión
      description: |
        Autentica las credenciales y emite un token personal de Sanctum.
        El token es opaco (`{id}|{40 caracteres}`), no un JWT.

        La ruta está limitada a 5 intentos por minuto y por combinación de
        email e IP. Los intentos fallidos consumen la cuota.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: <email>
              password: <password>
      responses:
        '200':
          description: Autenticación exitosa.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '403':
          $ref: '#/components/responses/InactiveUserError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      summary: Cerrar sesión
      description: Revoca únicamente el token Bearer utilizado en la petición.
      tags:
        - Authentication
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/InactiveUserError'

  /auth/me:
    get:
      summary: Obtener el usuario autenticado
      description: |
        Devuelve la identidad global del usuario dueño del token Bearer.
        No requiere la cabecera X-Organization-Id ni contexto de tenant.
        No refleja la organización seleccionada: la identidad de sesión en las
        rutas de dominio depende de la organización que el usuario selecciona
        y envía con X-Organization-Id (D-28b).
      tags:
        - Authentication
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/InactiveUserError'

  /auth/organizations:
    get:
      summary: Listar organizaciones del usuario autenticado
      description: |
        Devuelve las organizaciones cliente activas en las que el usuario
        autenticado tiene una membresía activa. No requiere la cabecera
        X-Organization-Id ni contexto de tenant.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de organizaciones obtenida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        code:
                          type: string
                        type:
                          type: string
                          enum: [client]
                        status:
                          type: boolean
                        membership_id:
                          type: string
                          format: uuid
                        membership_status:
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/InactiveUserError'

  # ===================================================================
  # ORGANIZATION
  # ===================================================================

  /plants:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Listar Plantas
      description: |
        Lista paginada de plantas del tenant activo. Requiere `plants.view`;
        sin `locations.view_all` solo incluye plantas asignadas al usuario.
        No devuelve áreas ni líneas anidadas.
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: status
          schema:
            type: boolean
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
        - in: query
          name: include_hierarchy
          deprecated: true
          schema:
            type: boolean
          description: |
            Parámetro heredado ignorado por el backend actual: no devuelve áreas
            ni líneas y no habilita la selección jerárquica remota de la PWA.
            Su futura retirada requiere una transición coordinada con consumidores.
      responses:
        '200':
          description: Lista de plantas obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plant'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '422':
          description: Parámetros de paginación inválidos; code validation_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crear Planta
      description: |
        Requiere usuario autenticado, organización cliente activa seleccionada
        mediante `X-Organization-Id`, membresía activa y permiso `plants.manage`.
        Solo admite atributos en el body JSON; rechaza cualquier parámetro query,
        archivo adjunto o campo adicional con 422 `validation_failed`.
        El código se recorta y convierte a mayúsculas antes de comprobar que
        contiene solo A-Z, 0-9 y guion ASCII, con máximo 50 caracteres.
        Un código duplicado en la organización, incluso con soft delete, se
        rechaza con 422; la garantía final es el índice `plants_org_code_unique`.
        Otros errores SQL no se convierten en validación.
      tags:
        - Organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantCreateInput'
            example:
              name: Planta Norte
              code: " pl-01 "
              address: Av. Industria 100
              description: null
      responses:
        '201':
          description: Planta creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/PlantCreated'
              example:
                data:
                  id: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
                  organization_id: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e40"
                  name: Planta Norte
                  code: PL-01
                  address: Av. Industria 100
                  description: null
                  status: true
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '422':
          description: Datos inválidos, campos adicionales, query o archivos no permitidos, o código duplicado en la organización; code validation_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ValidationFailed'

  /plants/{plantId}:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Obtener Planta
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      responses:
        '200':
          description: Detalle de la planta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Plant'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      x-status: planned
      summary: Actualizar Planta
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantInput'
      responses:
        '200':
          description: Planta actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Plant'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: Datos inválidos o referencia a recursos de otra organización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ValidationFailed'
                crossTenantOperation:
                  $ref: '#/components/examples/CrossTenantRelation'
    patch:
      x-status: planned
      summary: Activar/Desactivar Planta
      description: Cambia el estado lógico de la planta (activa o inactiva).
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Plant'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /plants/{plantId}/areas:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Listar Áreas de una Planta
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: status
          schema:
            type: boolean
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Áreas listadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Area'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      summary: Crear Área
      description: |
        Crea un área en la planta indicada. Requiere una membresía activa en
        X-Organization-Id y el permiso plants.manage; no requiere plants.view
        ni asignación a la planta. Los códigos se normalizan con trim y
        mayúsculas antes de validar ASCII A–Z, 0–9 y guion, y son únicos por
        planta incluso si el área previa está eliminada lógicamente.
      tags:
        - Organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaCreateInput'
      responses:
        '201':
          description: Área creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaCreatedResponse'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '415':
          description: El Content-Type no es application/json; también se rechaza multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            JSON inválido, propiedades extra, parámetros query, datos inválidos,
            planta propia inactiva o código duplicado en la planta. La planta
            inactiva se identifica en errors.plantId; la duplicidad en errors.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ValidationFailed'
                inactivePlant:
                  value:
                    message: The given data was invalid.
                    code: validation_failed
                    errors:
                      plantId:
                        - La planta está inactiva.
                duplicateCode:
                  value:
                    message: The given data was invalid.
                    code: validation_failed
                    errors:
                      code:
                        - El código ya está en uso.

  /areas/{areaId}:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Obtener Área
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/areaIdParam'
      responses:
        '200':
          description: Detalle del área.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Area'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      x-status: planned
      summary: Actualizar Área
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/areaIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaInput'
      responses:
        '200':
          description: Área actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Area'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
