  /inspections/{inspectionId}/answers/{questionId}:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
      - $ref: '#/components/parameters/inspectionIdParam'
      - $ref: '#/components/parameters/questionIdParam'
    put:
      summary: Crear o reemplazar una respuesta
      description: |
        `PUT` es un reemplazo completo e idempotente de la respuesta editable de
        la pregunta en la inspección. La identidad funcional es
        `(inspection_id, question_id)`: no se crean duplicados.

        **Autorización de escritura** — todas las condiciones son necesarias:

        - membresía activa en la organización y asignación vigente a la planta o
          área de la inspección;
        - propietario de la inspección (`inspections.user_id`);
        - `inspections.execute`. `inspections.manage` **nunca** concede
          escritura de respuestas;
        - inspección en estado `draft`. Estados `completed`, `confirmed` o
          `rejected` responden 422 con clave `inspection`;
        - pregunta existente, activa y perteneciente a la sección y versión
          originales de la inspección.

        **Campos derivados en el servidor** — el cuerpo está cerrado: solo
        `answer` y `observation`. Cualquier otro campo (`id`, `organization_id`,
        `inspection_id`, `question_id`, `checklist_version_id`,
        `checklist_section_id`, `created_at`, `updated_at`, `status`) responde
        422. La organización, la versión y la sección se derivan de la
        inspección y de la pregunta; nunca se aceptan del cliente.

        **Parámetros de consulta** — la escritura no admite parámetros de
        consulta: cualquiera de ellos responde 422. El valor solo puede
        provenir del cuerpo JSON; un parámetro de consulta no puede completar
        ni eludir la validación del cuerpo.

        **Validación por `answer_type`** (el tipo se lee de la pregunta, no del
        cuerpo):

        - `boolean`: `"true"` o `"false"` (minúsculas exactas).
        - `text`: string no vacío de hasta 65535 bytes UTF-8. Se conservan los
          espacios; no se recorta.
        - `number`: decimal simple de hasta 64 caracteres con signo negativo
          opcional (`-?\d+(\.\d+)?`). Se rechazan exponente, coma decimal,
          `+`, `INF` y `NAN`.
        - `date`: `YYYY-MM-DD` con fecha de calendario real.
        - `multiple_choice`: exactamente uno de los `value` configurados en
          `options`.
        - `signature`: rechazado (422); no es escribible en INS-02.
        - Se rechazan `null`, cadena vacía, arreglos, `__NA__` y observación
          sin respuesta.

        `observation` es opcional y nullable, máximo 65535 bytes UTF-8. Omitirla
        equivale a `null` (reemplazo completo). Un `PUT` idéntico responde 200
        sin modificar timestamps ni generar auditoría. La primera escritura crea
        un UUIDv7 y audita `inspection.answer_created`; un cambio audita
        `inspection.answer_updated` solo con identificadores, tipo y campos
        modificados, nunca con valores. La transacción bloquea la inspección; la
        política de concurrencia es last-write-wins sin control optimista ni
        idempotencia de red.

        **Límite de estado**: fuera de `draft` no se admiten escrituras. Las
        respuestas se conservan al cambiar de estado, pero dejan de ser
        editables. La respuesta 200 devuelve el DTO de la respuesta; no incluye
        versión ni sección.
      tags:
        - Inspections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionAnswerInput'
      responses:
        '200':
          description: Respuesta creada o reemplazada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/InspectionAnswer'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Inspección visible pero no escribible: falta `inspections.execute`,
            el usuario no es propietario, la membresía no está activa o falta la
            asignación. `inspections.manage` no concede escritura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          description: |
            Inspección no visible o inexistente, o pregunta inexistente o fuera
            de la versión original de la inspección.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  $ref: '#/components/examples/NotFound'
        '422':
          description: |
            Cuerpo inválido o cerrado, respuesta inválida para el tipo, pregunta
            inactiva o inspección fuera de `draft` (validation_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ValidationFailed'
    delete:
      summary: Eliminar una respuesta
      description: |
        Elimina la respuesta de la pregunta en la inspección. La operación es
        idempotente: si no existe una respuesta para una pregunta válida,
        responde 204 sin auditoría.

        **Autorización** — idéntica a `PUT`: membresía activa, asignación
        vigente, propietario, `inspections.execute` e inspección en `draft`.
        `inspections.manage` no concede borrado. Una inspección visible pero no
        borrable responde 403; una inspección o pregunta inexistente, de otra
        organización o fuera de la versión original responde 404.

        **Evidencias**: si existen filas de `evidences` que referencian la
        respuesta, la FK RESTRICT impide el borrado y la API responde 422 con
        clave `answer`. Nunca se eliminan evidencias en cascada ni se modifica
        su contenido. Si una evidencia se inserta concurrentemente entre la
        comprobación y el `DELETE`, la restricción del motor se convierte en el
        mismo 422. Solo esa violación de clave foránea se traduce a 422:
        cualquier otro error de integridad se propaga y no se presenta como
        un bloqueo por evidencias.

        **Parámetros de consulta** — el borrado no admite parámetros de
        consulta: cualquiera de ellos responde 422.

        **Límite de estado**: solo inspecciones `draft`. Fuera de ese estado
        responde 422 con clave `inspection`, incluso si no hay respuesta. Al
        eliminar se audita `inspection.answer_deleted` con identificadores, tipo
        y presencia de contenido; nunca con valores. Si no se elimina nada no se
        genera auditoría.
      tags:
        - Inspections
      responses:
        '204':
          description: Respuesta eliminada o inexistente para una pregunta válida.
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Inspección visible pero no borrable: falta `inspections.execute`, el
            usuario no es propietario, la membresía no está activa o falta la
            asignación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          description: |
            Inspección no visible o inexistente, o pregunta inexistente o fuera
            de la versión original de la inspección.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  $ref: '#/components/examples/NotFound'
        '422':
          description: |
            Inspección fuera de `draft`, pregunta inactiva o respuesta con
            evidencias asociadas (validation_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ValidationFailed'

  /inspections/{inspectionId}/complete:
