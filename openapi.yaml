        required_questions:
          type: integer
          minimum: 0
          description: Total de preguntas obligatorias activas de la versión.

    InspectionBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f6a7b-2222-7a8b-8000-abcdef123456"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece la inspección.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        user_id:
          type: string
          format: uuid
          description: ID del inspector (BD inspections.user_id).
          example: "018f2b3c-4d5e-7f8a-8000-112233445566"
        supervisor_id:
          type: string
          format: uuid
          nullable: true
          description: ID del autor de la evaluación (BD inspections.supervisor_id), no de un supervisor asignado.
          example: "018f2b3c-4d5e-7f8a-8000-112233445566"
        checklist_version_id:
          type: string
          format: uuid
          description: Versión del checklist utilizada (BD inspections.checklist_version_id).
          example: "018f3d5e-4321-7a8b-8000-aabbccddeeff"
        plant_id:
          type: string
          format: uuid
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        area_id:
          type: string
          format: uuid
          example: "018f1a2c-1111-7e5f-8000-abcdef123456"
        production_line_id:
          type: string
          format: uuid
          nullable: true
          example: "018f1a2d-2222-7e5f-8000-fedcba654321"
        status:
          type: string
          enum: [draft, completed, confirmed, rejected]
          description: |
            Estado de la inspección:
            - `draft`: Borrador.
            - `completed`: Completada en campo.
            - `confirmed`: Confirmada por supervisor.
            - `rejected`: Rechazada por supervisor.
          example: "completed"
        started_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-12T10:00:00Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-12T10:45:00Z"
        supervisor_confirmed_at:
          type: string
          format: date-time
          nullable: true
        rejected_at:
          type: string
          format: date-time
          nullable: true
        location_description:
          type: string
          maxLength: 255
          nullable: true
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitud (BD DECIMAL(10,7), 7 decimales).
          example: 20.659698
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitud (BD DECIMAL(10,7), 7 decimales).
          example: -103.349609
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    InspectionSyncInput:
      type: object
      required:
        - checklist_version_id
        - plant_id
        - area_id
        - answers
      properties:
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: ID de la organización. La organización activa se selecciona mediante la cabecera X-Organization-Id y una membresía activa; no se infiere del token.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        checklist_version_id:
          type: string
          format: uuid
          description: Versión del checklist utilizada.
          example: "018f3d5e-4321-7a8b-8000-aabbccddeeff"
        plant_id:
          type: string
          format: uuid
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        area_id:
          type: string
          format: uuid
          example: "018f1a2c-1111-7e5f-8000-abcdef123456"
        production_line_id:
          type: string
          format: uuid
          nullable: true
          example: null
        status:
          type: string
          enum: [draft, completed]
          description: Estado de la inspección (BD inspections.status).
          example: "completed"
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha/hora de inicio (BD inspections.started_at).
          example: "2026-10-12T10:00:00Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha/hora de finalización (BD inspections.completed_at).
          example: "2026-10-12T10:45:00Z"
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 20.659698
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: -103.349609
        location_description:
          type: string
          maxLength: 255
          nullable: true
          example: "Pasillo principal, junto a la extintor E-12."
        observations:
          type: string
          maxLength: 65535
          nullable: true
          example: "Se detectó personal nuevo sin EPP."
        answers:
          type: array
          description: "Arreglo de respuestas recopiladas en campo. Cada `question_id` debe pertenecer al checklist_version_id indicado."
          items:
            $ref: '#/components/schemas/AnswerInput'

    AnswerInput:
      type: object
      required:
        - question_id
      properties:
        question_id:
          type: string
          format: uuid
          description: ID de la pregunta del checklist.
          example: "018f4e5f-5678-7a8b-8000-fedcba654321"
        answer:
          type: string
          nullable: true
          description: |
            Valor de la respuesta como string. La interpretación depende del `answer_type`:
            - `boolean`: "true" / "false".
            - `text`: texto libre.
            - `number`: número como string (ej. "12.5").
            - `multiple_choice`: valor de la opción seleccionada.
            - `signature`: datos de la firma (ej. URL o base64).
            - `date`: fecha ISO 8601.
          example: "false"
        observation:
          type: string
          maxLength: 65535
          nullable: true
          example: "El extintor de la zona norte está caducado."

    InspectionChecklist:
      type: object
      description: |
        Contenido histórico del checklist congelado en la inspección. Se ordena
        por `display_order` e `id`; no expone preguntas inactivas ni de otras
        versiones.
      additionalProperties: false
      required: [inspection_id, checklist, checklist_version, sections]
      properties:
        inspection_id:
          type: string
          format: uuid
          example: "018f6a7b-2222-7a8b-8000-abcdef123456"
        checklist:
          type: object
          additionalProperties: false
          required: [id, name, status]
          properties:
            id:
              type: string
              format: uuid
              example: "018f3d4e-1234-7a8b-8000-abcdef123456"
            name:
              type: string
              nullable: true
              example: "Checklist de seguridad"
            status:
              type: boolean
              nullable: true
              description: Estado actual del checklist; no altera la lectura histórica.
              example: false
        checklist_version:
          type: object
          additionalProperties: false
          required: [id, version, status, published_at]
          properties:
            id:
              type: string
              format: uuid
              example: "018f3d5e-4321-7a8b-8000-aabbccddeeff"
            version:
              type: string
              maxLength: 20
              example: "1"
            status:
              type: string
              example: "archived"
            published_at:
              type: string
              format: date-time
              nullable: true
              example: "2026-10-10T14:30:00Z"
        sections:
          type: array
          items:
            $ref: '#/components/schemas/InspectionChecklistSection'

    InspectionChecklistSection:
      type: object
      additionalProperties: false
      required: [id, name, description, display_order, questions]
      properties:
        id:
          type: string
          format: uuid
          example: "018f3e5f-9999-7a8b-8000-112233445566"
        name:
          type: string
          maxLength: 150
          example: "1. Equipos de Emergencia"
        description:
          type: string
          nullable: true
          example: "Validación de extintores y mangueras."
        display_order:
          type: integer
          minimum: 1
          example: 1
        questions:
          type: array
          items:
            $ref: '#/components/schemas/InspectionChecklistQuestion'

    InspectionChecklistQuestion:
      type: object
      additionalProperties: false
      required:
        - id
        - question_text
        - description
        - answer_type
        - options
        - required
        - allows_evidence
        - display_order
        - supported
        - norm_requirements
      properties:
        id:
          type: string
          format: uuid
          example: "018f4e5f-5678-7a8b-8000-fedcba654321"
        question_text:
          type: string
          maxLength: 65535
          example: "¿Todos los extintores tienen carga vigente?"
        description:
          type: string
          nullable: true
          example: "Verifique visualmente la etiqueta de inspección mensual."
        answer_type:
          type: string
          enum: [boolean, text, number, date, multiple_choice, signature]
          description: |
            Tipo almacenado en la pregunta. `signature` se conserva como lectura
            histórica pero no puede escribirse mediante la API de respuestas.
          example: "boolean"
        options:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value:
                type: string
                example: "si"
              label:
                type: string
                example: "Sí"
        required:
          type: boolean
          example: true
        allows_evidence:
          type: boolean
          example: true
        display_order:
          type: integer
          minimum: 1
          example: 1
        supported:
          type: boolean
          description: |
            `true` para `boolean`, `text`, `number`, `date` y
            `multiple_choice`; `false` para `signature` y para tipos
            desconocidos.
          example: true
        norm_requirements:
          type: array
          description: Requerimientos normativos enlazados, ordenados por code e id.
          items:
            $ref: '#/components/schemas/InspectionChecklistNormRequirement'

    InspectionChecklistNormRequirement:
      type: object
      additionalProperties: false
      required: [link_id, id, code, description]
      properties:
        link_id:
          type: string
          format: uuid
          description: ID de la fila question_norm_requirement.
          example: "018f6a7b-1111-7a8b-8000-abcdef123456"
        id:
          type: string
          format: uuid
          description: ID del requerimiento normativo.
          example: "018f5f6a-1111-7a8b-8000-123456789abc"
        code:
          type: string
          example: "REQ-1"
        description:
          type: string
          nullable: true
          example: "Requisito vinculado"

    InspectionAnswer:
      type: object
      description: Respuesta editable de una pregunta dentro de una inspección.
      additionalProperties: false
      required: [id, inspection_id, question_id, answer, observation, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 asignado por el servidor al crear la respuesta.
          example: "018f6b8c-3333-7a8b-8000-ccddeeff1122"
        inspection_id:
          type: string
          format: uuid
          example: "018f6a7b-2222-7a8b-8000-abcdef123456"
        question_id:
          type: string
          format: uuid
          example: "018f4e5f-5678-7a8b-8000-fedcba654321"
        answer:
          type: string
          maxLength: 65535
          nullable: false
          description: |
            Valor almacenado como string. El formato depende del `answer_type`
            de la pregunta y se revalida en cada escritura.
          example: "true"
        observation:
          type: string
          maxLength: 65535
          nullable: true
          example: "El extintor de la zona norte está caducado."
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    InspectionAnswerInput:
      type: object
      additionalProperties: false
      required: [answer]
      description: |
        Cuerpo cerrado de escritura de respuestas. Organización, inspección,
        pregunta, versión, sección, identificadores y timestamps se derivan en el
        servidor. Omitir `observation` equivale a `null` porque el PUT es un
        reemplazo completo.
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 65535
          description: |
            Respuesta obligatoria. Debe ser válida para el `answer_type` de la
            pregunta:
            - `boolean`: `"true"` o `"false"`.
            - `text`: hasta 65535 bytes UTF-8 sin recorte; no vacío ni
              compuesto exclusivamente por espacios en blanco.
            - `number`: decimal simple de hasta 64 caracteres, sin exponente ni
              coma.
            - `date`: `YYYY-MM-DD` con fecha real.
            - `multiple_choice`: uno de los `value` configurados.
            - `signature`: no admitido (422).
            Se rechazan `null`, cadenas vacías, arreglos, `__NA__` y tipos no
            soportados.
          example: "true"
        observation:
          type: string
          nullable: true
          maxLength: 65535
          description: Observación opcional de hasta 65535 bytes UTF-8.
          example: "El extintor de la zona norte está caducado."

    InspectionDetail:
      allOf:
        - $ref: '#/components/schemas/InspectionBase'
        - type: object
          properties:
            supervisor_observations:
              type: string
              maxLength: 65535
              nullable: true
              example: "Buen reporte, procedo a levantar incidencias derivadas."
            answers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: "018f6b8c-3333-7a8b-8000-ccddeeff1122"
                  question_id:
                    type: string
                    format: uuid
                    example: "018f4e5f-5678-7a8b-8000-fedcba654321"
                  answer:
                    type: string
                    nullable: true
                    example: "false"
                  observation:
                    type: string
                    nullable: true
                    example: "El extintor de la zona norte está caducado."

    InspectionStatusInput:
      description: Solo inspecciones completadas; motivo original de rechazo con contenido no blanco y máximo 65535 bytes UTF-8.
      oneOf:
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              type: string
              enum: [confirm]
        - type: object
          additionalProperties: false
          required: [action, supervisor_observations]
          properties:
            action:
              type: string
              enum: [reject]
            supervisor_observations:
              type: string
              minLength: 1
              maxLength: 65535
              description: Motivo no blanco, máximo 65535 bytes UTF-8.

