          nullable: true
          example: "2026-10-01T09:00:00Z"

    PlantCreateInput:
      type: object
      additionalProperties: false
      required: [name, code]
      properties:
        name:
          type: string
          maxLength: 150
          description: Nombre no vacío.
          example: "Planta Norte"
        code:
          type: string
          minLength: 1
          description: |
            Obligatorio. El middleware recorta espacios y caracteres invisibles
            de los extremos; después se aplica trim de PHP y se convierten letras
            ASCII a mayúsculas. El resultado debe contener entre 1 y 50 caracteres,
            exclusivamente A-Z, 0-9 o guion ASCII, y ser único por organización,
            incluidas plantas con soft delete. Se aceptan minúsculas y caracteres
            recortables en los extremos, pero no caracteres inválidos en el interior.
            Las restricciones OpenAPI sobre el valor bruto no representan de forma
            portable esta normalización: validar solo este esquema no garantiza
            que el servidor acepte el código; el servidor aplica la regla completa.
          example: "PLN-01"
        address:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    PlantCreated:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, code, address, description, status]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 generado por el servidor.
        organization_id:
          type: string
          format: uuid
          description: Organización obtenida del contexto tenant.
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
          pattern: '^[A-Z0-9-]+$'
        address:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: boolean
          description: true al crear la planta.

    PlantInput:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          maxLength: 150
          example: "Planta Norte"
        code:
          type: string
          maxLength: 50
          example: "PLN-01"
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: ID de la organización. La organización activa se selecciona mediante la cabecera X-Organization-Id y una membresía activa; no se infiere del token.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        address:
          type: string
          nullable: true
          example: "Av. Industria 100, Jalisco"
        description:
          type: string
          nullable: true
          example: "Planta principal de manufactura"

    Area:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 018f1a2c-1111-7e5f-8000-abcdef123456
        organization_id:
