      type: object
      additionalProperties: false
      required: [id, organization_id, name, code, address, description, status]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 generado por el servidor.
        organization_id:
          type: string
          format: uuid
          description: Organización obtenida del contexto tenant.
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
          pattern: '^[A-Z0-9-]+$'
        address:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: boolean
          description: true al crear la planta.

