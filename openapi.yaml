          nullable: true

    # -------------------------------------------------------------------
    # Corrective Actions
    # -------------------------------------------------------------------

    CorrectiveAction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f9a1b-6666-7a8b-8000-abcdef123456"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece la acción correctiva.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        incident_id:
          type: string
          format: uuid
          example: "018f7b8c-4444-7a8b-8000-abcdef123456"
        assigned_to:
          type: string
          format: uuid
          description: "ID del usuario responsable."
          example: "018f2b3c-4d5e-7f8a-8000-112233445566"
        description:
          type: string
          maxLength: 65535
          example: "Limpiar derrame de solvente y colocar material absorbente."
        priority:
          type: string
          enum: [low, medium, high, critical]
          example: "high"
        due_date:
          type: string
          format: date
          nullable: true
          example: "2026-10-15"
        status:
          type: string
          enum: [pending, in_progress, completed, verified]
          example: "in_progress"
        observations:
          type: string
          maxLength: 65535
          nullable: true
          example: "Asegurarse de usar mascarilla contra vapores."
        completed_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    CorrectiveActionInput:
      type: object
      required:
        - incident_id
        - assigned_to
        - description
      properties:
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: ID de la organización. Si no se envía, se toma del token JWT del usuario autenticado.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        incident_id:
          type: string
          format: uuid
          example: "018f7b8c-4444-7a8b-8000-abcdef123456"
        assigned_to:
          type: string
          format: uuid
          example: "018f2b3c-4d5e-7f8a-8000-112233445566"
        description:
          type: string
          maxLength: 65535
          example: "Limpiar derrame de solvente y colocar material absorbente."
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
          example: "high"
        due_date:
          type: string
          format: date
          nullable: true
          example: "2026-10-15"
        observations:
          type: string
          maxLength: 65535
          nullable: true
          description: "Instrucciones adicionales opcionales."
          example: "Asegurarse de usar mascarilla contra vapores."

    CorrectiveActionUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f9b2c-7777-7a8b-8000-112233445566"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece la actualización.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        corrective_action_id:
          type: string
          format: uuid
          example: "018f9a1b-6666-7a8b-8000-abcdef123456"
        user_id:
          type: string
          format: uuid
          description: "ID del usuario que registró el avance (BD corrective_action_updates.user_id)."
          example: "018f2b3c-4d5e-7f8a-8000-112233445566"
        status:
          type: string
          enum: [in_progress, completed, verified]
          example: "completed"
        comment:
          type: string
          maxLength: 65535
          nullable: true
          example: "Se limpió el área y se confinó el material absorbente en los contenedores rojos."
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-13T09:30:00Z"

    CorrectiveActionUpdateInput:
      type: object
      required:
        - status
      properties:
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: ID de la organización. Si no se envía, se toma del token JWT del usuario autenticado.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        status:
          type: string
          enum: [in_progress, completed, verified]
          description: Nuevo estado de la acción. No puede retroceder a `pending`.
          example: "completed"
        comment:
          type: string
          maxLength: 65535
          nullable: true
          example: "Se limpió el área y se confinó el material absorbente en los contenedores rojos."

    CorrectiveActionDetail:
      allOf:
        - $ref: '#/components/schemas/CorrectiveAction'
        - type: object
          properties:
            updates:
              type: array
              description: "Historial cronológico de la tarea."
              items:
                $ref: '#/components/schemas/CorrectiveActionUpdate'

    # -------------------------------------------------------------------
    # Audit Logs
    # -------------------------------------------------------------------

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018fa1b2-3333-7a8b-8000-abcdef123456"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece el registro de auditoría.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        user_id:
          type: string
          format: uuid
          nullable: true
          description: "ID del usuario que ejecutó la acción. Puede ser nulo si fue un proceso del sistema (FK ON DELETE SET NULL)."
          example: "018f2b3c-4d5e-7f8a-8000-112233445566"
        action:
          type: string
          enum: [created, updated, deleted]
          description: "Tipo de operación realizada (BD audit_logs.action)."
          example: "updated"
        auditable_type:
          type: string
          maxLength: 100
          description: "Nombre del modelo o entidad afectada (BD audit_logs.auditable_type)."
          example: "Incident"
        auditable_id:
          type: string
          format: uuid
          description: "ID del recurso afectado (BD audit_logs.auditable_id)."
          example: "018f7b8c-4444-7a8b-8000-abcdef123456"
        old_values:
          type: object
          nullable: true
          additionalProperties: true
          description: "Estado de las columnas antes de la modificación (BD JSON, nulo si es creación)."
          example:
            status: "open"
            risk_level: "high"
        new_values:
          type: object
          nullable: true
          additionalProperties: true
          description: "Estado de las columnas después de la modificación (BD JSON, nulo si es eliminación)."
          example:
            status: "resolved"
            risk_level: "low"
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-14T16:45:00Z"

    # -------------------------------------------------------------------
    # Sync (Offline / PWA)
    # -------------------------------------------------------------------

    Device:
      type: object
      description: Dispositivo móvil registrado para sincronización offline.
      properties:
        id:
          type: string
          format: uuid
          example: "018fa1b2-1111-7a8b-8000-abcdef123456"
        device_id:
          type: string
          format: uuid
          description: Identificador persistente del dispositivo (generado por la PWA).
          example: "018f9c1d-1111-7a8b-8000-aabbccddeeff"
        user_id:
          type: string
          format: uuid
          nullable: true
          description: ID del usuario autenticado en el dispositivo (BD devices.user_id).
          example: "018f2b3c-4d5e-7f8a-8000-112233445566"
        last_sync_at:
          type: string
          format: date-time
          nullable: true
          description: Última sincronización exitosa.
          example: "2026-10-22T09:15:00Z"
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Si no es nulo, el dispositivo está revocado y no puede sincronizar.
          example: null
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    DeviceInput:
      type: object
      required:
        - device_id
      properties:
        device_id:
          type: string
          format: uuid
          description: Identificador persistente del dispositivo (generado por la PWA).
          example: "018f9c1d-1111-7a8b-8000-aabbccddeeff"

    SyncChange:
      type: object
      description: Un cambio de un recurso en el change log del servidor. `seq` es el cursor de sincronización.
      required:
        - seq
        - resource
        - resource_id
        - operation
      properties:
        id:
          type: string
          format: uuid
          example: "018fa2b3-2222-7a8b-8000-abcdef123456"
        seq:
          type: integer
          format: int64
          description: Secuencia mono-tónica. Define el orden global del stream de cambios.
          example: 10427
        resource:
          type: string
          example: "incident"
        resource_id:
          type: string
          format: uuid
          example: "018f7b8c-4444-7a8b-8000-abcdef123456"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece el cambio.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        operation:
          type: string
          enum: [upsert, delete]
          description: "`delete` actúa como tombstone: el cliente elimina su copia local."
          example: "upsert"
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: Estado completo del recurso. `null` cuando operation = delete.
          example:
            id: "018f7b8c-4444-7a8b-8000-abcdef123456"
            title: "Derrame químico en pasillo principal"
            risk_level: "high"
            status: "open"
        changed_at:
          type: string
          format: date-time
          example: "2026-10-22T09:12:00Z"

    SyncCursor:
      type: object
      description: Cursor opaco de sincronización emitido por el servidor.
      required:
        - seq
      properties:
        seq:
          type: integer
          format: int64
          example: 10427
        issued_at:
          type: string
          format: date-time
          example: "2026-10-22T09:15:00Z"

    SyncChangeList:
      type: object
      description: Lista de cambios del servidor con paginación incremental.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        meta:
          type: object
          properties:
            cursor:
              $ref: '#/components/schemas/SyncCursor'
            has_more:
              type: boolean
              example: true
            server_time:
              type: string
              format: date-time
              example: "2026-10-22T09:15:00Z"

    SyncOperation:
      type: object
      description: Resultado individual de una operación de sincronización enviada por la PWA.
      required:
        - operation_id
        - status
      properties:
        operation_id:
          type: string
          format: uuid
          example: "018f9c2e-2222-7a8b-8000-aabbccddeeff"
        status:
          type: string
          enum: [applied, duplicate, conflict, rejected, forbidden, skipped]
          description: |
            - `applied`: aplicada correctamente.
            - `duplicate`: ya se había aplicado (idempotencia). Es un éxito.
            - `conflict`: el servidor tiene un estado incompatible. Incluye `server_state`.
            - `rejected`: error de validación permanente. Incluye `errors`. No reintentar.
            - `forbidden`: el usuario ya no tiene permiso. No reintentar.
            - `skipped`: una dependencia falló. Reintentar tras resolver la dependencia.
          example: "applied"
        resource_id:
          type: string
          format: uuid
          nullable: true
          example: "018f7b8c-4444-7a8b-8000-abcdef123456"
        version:
          type: integer
          nullable: true
          description: Nueva versión (lock_version) del recurso tras aplicar la operación.
          example: 1
        server_state:
          type: object
          nullable: true
          additionalProperties: true
          description: Estado actual del recurso en el servidor (para `conflict`).
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
          description: Detalle de validación (para `rejected`).
        retryable:
          type: boolean
          example: false

    SyncBatchRequest:
      type: object
      description: Lote de operaciones de sincronización enviadas por la PWA.
      required:
        - device_id
        - operations
      properties:
        device_id:
          type: string
          format: uuid
          description: Identificador persistente del dispositivo.
          example: "018f9c1d-1111-7a8b-8000-aabbccddeeff"
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncOperationInput'

    SyncOperationInput:
      type: object
      description: Una operación individual dentro de un lote de sincronización.
      required:
        - operation_id
        - resource
        - operation
        - payload
      properties:
        operation_id:
          type: string
          format: uuid
          description: Identificador único y estable de esta operación (clave de idempotencia). No confundir con el `id` del recurso de negocio.
          example: "018f9c2e-2222-7a8b-8000-aabbccddeeff"
        resource:
          type: string
          enum: [inspection, inspection_answer, incident, evidence, corrective_action_update]
          example: "incident"
        operation:
          type: string
          enum: [create, update, delete]
          example: "create"
        payload:
          type: object
          additionalProperties: true
          description: Cuerpo de la operación. Para `create` puede incluir `id` (UUID del cliente).
          example:
            id: "018f7b8c-4444-7a8b-8000-abcdef123456"
            title: "Derrame químico en pasillo principal"
            description: "Derrame de solvente de ~2 m²."
            risk_level: "high"
            reported_at: "2026-10-21T08:40:00Z"
        base_version:
          type: integer
          minimum: 0
          description: Versión conocida por el cliente del recurso (bloqueo optimista). Solo para `update`.
          example: 3
        depends_on:
          type: array
          description: Identificadores de operaciones que deben aplicarse antes que esta.
          items:
            type: string
            format: uuid
          example: ["018f9c2d-3333-7a8b-8000-aabbccddeeff"]

    SyncBatchResponse:
      type: object
      description: Respuesta del lote de operaciones con resultados individuales.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'
        cursor:
          $ref: '#/components/schemas/SyncCursor'
