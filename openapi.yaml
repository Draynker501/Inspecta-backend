  # ===================================================================
  # INSPECTIONS
  # ===================================================================

  /inspections:
    get:
      summary: Listar Inspecciones
      description: Obtiene una lista paginada de inspecciones. Útil para el dashboard web de supervisores.
      tags:
        - Inspections
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, completed, confirmed, rejected]
          description: Filtrar inspecciones por estado.
        - in: query
          name: plant_id
          schema:
            type: string
            format: uuid
          description: Filtrar inspecciones por planta.
        - in: query
          name: area_id
          schema:
            type: string
            format: uuid
          description: Filtrar inspecciones por área.
        - in: query
          name: user_id
          schema:
            type: string
            format: uuid
          description: Filtrar inspecciones por inspector.
        - in: query
          name: supervisor_id
          schema:
            type: string
            format: uuid
          description: Filtrar inspecciones por supervisor.
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          description: Fecha de inicio del rango (inclusive).
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          description: Fecha de fin del rango (inclusive).
      responses:
        '200':
          description: Lista de inspecciones obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InspectionBase'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Sincronizar/Crear Inspección
      description: Crea una inspección completa incluyendo sus respuestas en una sola transacción. Es el endpoint principal que consume la PWA al recuperar la conexión a internet.
      tags:
        - Inspections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionSyncInput'
      responses:
        '201':
          description: Inspección sincronizada correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InspectionDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
