    CapabilitiesResponse:
      type: object
      description: |
        Roles activos y capacidades generales del usuario dentro de
        la organización seleccionada.

        Las capacidades permiten determinar los módulos y operaciones
        disponibles en el cliente, pero no sustituyen las comprobaciones
        de autorización sobre recursos concretos.
      required:
        - organization_id
        - roles
        - modules
        - corrective_actions
        - administration
      properties:
        organization_id:
          type: string
          format: uuid
          description: Organización activa seleccionada mediante X-Organization-Id.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        roles:
          type: array
          description: |
            Nombres de los roles activos asignados al usuario dentro
            de la organización seleccionada, ordenados por nombre.

            Puede ser un arreglo vacío si el usuario no tiene roles activos.
            Los nombres son informativos y no deben utilizarse como
            mecanismo de autorización.
          items:
            type: string
          example:
            - Administrador
        modules:
          type: object
          description: |
            Capacidades generales de acceso a los módulos de la plataforma.
            El cliente puede utilizarlas para determinar las opciones
            de navegación disponibles.
          required:
            - dashboard
            - inspections
            - incidents
            - corrective_actions
            - checklists
            - norms
            - reports
            - administration
          properties:
            dashboard:
              type: boolean
              description: |
                Disponible para usuarios con acceso válido a la organización.
                No implica autorización sobre todas las estadísticas.
              example: true
            inspections:
              type: boolean
              description: Acceso general al módulo de inspecciones según InspectionPolicy.
              example: true
            incidents:
              type: boolean
              description: Acceso general al módulo de incidencias según IncidentPolicy.
              example: true
            corrective_actions:
              type: boolean
              description: |
                Acceso general al módulo de acciones correctivas.
                Equivale a la capacidad corrective_actions.view.
              example: true
            checklists:
              type: boolean
              description: Acceso general al módulo de checklists según ChecklistPolicy.
              example: true
            norms:
              type: boolean
              description: Acceso general al módulo de normativa según NormPolicy.
              example: true
            reports:
              type: boolean
              description: |
                Requiere el permiso reports.view o reports.view_own.
              example: true
            administration:
              type: boolean
              description: |
                Requiere al menos uno de los siguientes permisos:
                users.manage, roles.manage, memberships.manage
                o plants.manage.
              example: false
        corrective_actions:
          type: object
          required:
            - view
            - create
            - update
            - record_update
            - verify
          properties:
            view:
              type: boolean
              description: Puede acceder al listado y detalle según las policies por recurso.
            create:
              type: boolean
              description: Puede crear acciones correctivas (autorización general).
            update:
              type: boolean
              description: Puede editar acciones correctivas (autorización general).
            record_update:
              type: boolean
              description: Puede registrar avances (autorización general).
            verify:
              type: boolean
              description: |
                Puede verificar acciones completadas. Requiere
                `corrective_actions.verify` y un rol activo con
                `system_key` admin o supervisor; la separación
                ejecutor/responsable/verificador se comprueba por recurso.
        administration:
          type: object
          description: |
            Capacidades administrativas generales. No sustituyen la autorización
            sobre recursos concretos ni las restricciones de seguridad del tenant.
          required:
            - manage_users
            - manage_memberships
            - manage_roles
            - view_locations
            - manage_locations
            - view_all_locations
            - create_users
            - assign_roles
            - assign_locations
          properties:
            manage_users:
              type: boolean
              description: Permiso efectivo users.manage.
            manage_memberships:
              type: boolean
              description: Permiso efectivo memberships.manage.
            manage_roles:
              type: boolean
              description: Permiso efectivo roles.manage.
            view_locations:
              type: boolean
              description: Permiso efectivo plants.view.
            manage_locations:
              type: boolean
              description: Permiso efectivo plants.manage.
            view_all_locations:
              type: boolean
              description: Permiso efectivo locations.view_all; no sustituye el acceso operativo por ubicación.
            create_users:
              type: boolean
              description: Autorización general para crear usuarios y sus membresías.
            assign_roles:
              type: boolean
              description: Autorización general para gestionar asignaciones de roles, sujeta a las restricciones de privilegios.
            assign_locations:
              type: boolean
              description: Autorización general para gestionar asignaciones de ubicaciones, sujeta al alcance autorizado.

