        address:
          type: string
          nullable: true
          example: Av. Industria 100, Jalisco
        status:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-01T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-01T09:00:00Z'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de baja lógica (soft delete); nulo si no está eliminada lógicamente. Independiente de status.
          example: null
    AdministrationAreaUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        code:
          type: string
          description: Se recorta y convierte a mayúsculas antes de validar; el valor normalizado debe tener 1–50 caracteres ASCII A–Z, 0–9 o guion.
        description:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
          maxLength: 50
    AdministrationArea:
      type: object
      required:
        - id
        - organization_id
        - plant_id
        - name
        - code
        - description
        - type
        - status
      properties:
        id:
          type: string
          format: uuid
          example: 018f1a2c-1111-7e5f-8000-abcdef123456
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece el área.
          example: 018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f
        plant_id:
          type: string
          format: uuid
          example: 018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f
        name:
          type: string
          maxLength: 150
          example: Área de Soldadura
        code:
          type: string
          maxLength: 50
          example: AR-SOLD-01
          pattern: ^[A-Z0-9-]+$
        description:
