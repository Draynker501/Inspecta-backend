                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '422':
          description: Filtros inválidos o no admitidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crear inspección online
      description: |
        Requiere `inspections.execute`, membresía activa y asignación a planta
        o área. Crea una inspección propia en `draft`, con UUIDv7 y fecha de
        inicio del servidor. No admite respuestas, fechas, estado ni usuarios
        del cliente. No ofrece idempotencia ni sincronización offline; es
        incompatible con el POST offline anteriormente planeado y la PWA
        inspeccionada.
