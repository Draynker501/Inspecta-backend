openapi: 3.0.3

info:
  title: Inspecta API
  description: |
    Contrato de API para el sistema Inspecta de gestión de inspecciones,
    incidencias, evidencias y acciones correctivas en plantas industriales.

    **Convenciones transversales:**

    - Las colecciones paginadas usan paginación con parámetros `page` y `per_page`
      (estándar Laravel API Resources) y devuelven el envelope `{data, meta}`.
    - El campo `status` es booleano: `true` = activo, `false` = inactivo.
      La baja lógica mediante `deleted_at` es independiente del estado `status`.
    - El token identifica al usuario autenticado; la organización activa de las
      rutas de dominio se selecciona con `X-Organization-Id` y membresía activa,
      no se deriva del token. Los campos de actor y organización de cada operación
      se rigen por su contrato; en POST /plants `organization_id` no se admite en el body.
    - Aislamiento multi-tenant: un recurso de otra organización se comporta como
      inexistente (404) cuando se consulta por identificador y no revela su existencia.
    - v1.4.0 (aditiva, M1.5): cabecera X-Organization-Id (UUID) obligatoria en rutas de dominio; GET /auth/organizations; campo type en Organization (client/operator); identidad global en /auth/me.
    - v2.0.0 (D-16, D-31b, D-31c): sobre de error uniforme `{ message, code, errors? }`
      con códigos estables del catálogo (ver components/schemas/ErrorCode).
      Regla transversal: el mismo código implica el mismo estado HTTP y el mismo
      texto de message. Los errores fuera del catálogo (403 de policies, 405,
      500) pueden omitir `code`.
    - v2.4.0 (aditiva): GET /dashboard proporciona indicadores,
      estadísticas y resúmenes operativos de la organización activa,
      respetando permisos y restricciones de ubicación.

    - Coordenadas con precisión de 7 decimales (BD `DECIMAL(10,7)`):
      latitud −90..90, longitud −180..180.

    **Flujo de sesión:** `POST /auth/login` → `GET /auth/organizations`
    (organizaciones cliente con membresía activa) → el cliente selecciona una
    organización y la envía como cabecera `X-Organization-Id` en cada petición
    con contexto de dominio.

    Una vez seleccionada la organización, el cliente consulta
    `GET /auth/capabilities` para obtener los roles activos y las capacidades
    de acceso a los módulos y operaciones disponibles.

    `GET /auth/me` devuelve solo la identidad global del usuario,
    sin depender de la organización seleccionada.

    Al cambiar de organización, el cliente debe descartar el contexto
    anterior y consultar nuevamente `GET /auth/capabilities` utilizando
    la cabecera `X-Organization-Id` de la nueva organización.

    Ante un `organization_access_denied` con una selección previa, el cliente
    debe volver a consultar `GET /auth/organizations` y pedir otra selección.

    **Decisión por código:** los clientes deben decidir por `code` y no por el
    texto de `message` (por ejemplo, `cross_tenant_operation` tiene dos textos
    posibles).

    - Los paths marcados con `x-status: planned` están diseñados pero aún no
      implementados en el servidor; mientras tanto devuelven `not_found`
      (404, código `not_found`). No deben considerarse disponibles para consumo.

  version: 2.4.0

servers:
  - url: https://api.inspecta.com/api
    description: Servidor de Producción
  - url: http://localhost:8000/api
    description: Servidor de Desarrollo Local

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Inicio y cierre de sesión, e identidad del usuario autenticado.
  - name: Dashboard
    description: Indicadores y estadísticas operativas de seguridad e higiene.
  - name: Reports
    description: Reportes estadísticos consolidados.
  - name: Organization
  - name: Users
  - name: Checklists
  - name: Norms
  - name: Inspections
  - name: Incidents
  - name: Evidences
  - name: Corrective Actions
  - name: Audit Logs
  - name: Sync

paths:

  # ===================================================================
  # AUTHENTICATION
  # ===================================================================

  /auth/login:
    post:
      summary: Iniciar sesión
      description: |
        Autentica las credenciales y emite un token personal de Sanctum.
        El token es opaco (`{id}|{40 caracteres}`), no un JWT.

        La ruta está limitada a 5 intentos por minuto y por combinación de
        email e IP. Los intentos fallidos consumen la cuota.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: <email>
              password: <password>
      responses:
        '200':
          description: Autenticación exitosa.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '403':
          $ref: '#/components/responses/InactiveUserError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      summary: Cerrar sesión
      description: Revoca únicamente el token Bearer utilizado en la petición.
      tags:
        - Authentication
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/InactiveUserError'

  /auth/me:
    get:
      summary: Obtener el usuario autenticado
      description: |
        Devuelve la identidad global del usuario dueño del token Bearer.
        No requiere la cabecera X-Organization-Id ni contexto de tenant.
        No refleja la organización seleccionada: la identidad de sesión en las
        rutas de dominio depende de la organización que el usuario selecciona
        y envía con X-Organization-Id (D-28b).
      tags:
        - Authentication
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/InactiveUserError'

  /auth/capabilities:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Obtener capacidades generales de la organización activa
      description: |
        Devuelve los roles activos y las capacidades generales de acceso
        a los módulos de la plataforma para el usuario autenticado en la
        organización indicada por X-Organization-Id.

        Incluye las capacidades específicas de acciones correctivas,
        como lectura, creación, actualización, registro de avances
        y verificación. También incluye capacidades administrativas de
        usuarios, membresías, roles y ubicaciones.

        Los nombres de los roles son exclusivamente informativos.
        Las capacidades se determinan mediante las policies y los
        permisos efectivos del usuario dentro de la organización activa.

        No sustituye la autorización por recurso: las policies siguen
        decidiendo sobre cada recurso concreto y su ubicación.

        Las capacidades se recalculan en cada solicitud. No se exponen
        roles ni capacidades de organizaciones a las que el usuario
        no tiene acceso.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Capacidades de la organización activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '400':
          description: |
            Falta la cabecera X-Organization-Id o no es un UUID válido
            (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: membresía revocada, organización ajena/inactiva u
            organización operadora (organization_not_tenant).
            No devuelve roles ni capacidades de la organización solicitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/organizations:
    get:
      summary: Listar organizaciones del usuario autenticado
      description: |
        Devuelve las organizaciones cliente activas en las que el usuario
        autenticado tiene una membresía activa. No requiere la cabecera
        X-Organization-Id ni contexto de tenant.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de organizaciones obtenida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        code:
                          type: string
                        type:
                          type: string
                          enum: [client]
                        status:
                          type: boolean
                        membership_id:
                          type: string
                          format: uuid
                        membership_status:
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/InactiveUserError'

  # ===================================================================
  # DASHBOARD
  # ===================================================================

  /dashboard:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Obtener estadísticas del Dashboard
      description: |
        Devuelve indicadores autorizados de la organización activa,
        considerando los permisos, las ubicaciones asignadas y la
        propiedad de las inspecciones.

        El mes predeterminado es el actual.

        La tasa de aprobación utiliza las inspecciones confirmadas
        y rechazadas durante el periodo, considerando sus fechas
        de revisión. El total de inspecciones utiliza su fecha
        de inicio.

        Las incidencias abiertas y las acciones pendientes representan
        el estado actual, independientemente del mes seleccionado.

        La tendencia de aprobación admite tres agrupaciones:
        - weekly: intervalos consecutivos de siete días dentro
          del mes seleccionado, con un último intervalo ajustado
          a la duración del mes.
        - monthly: últimos cinco meses, incluyendo el seleccionado.
        - yearly: últimos cinco años calendario completos,
          incluyendo el año seleccionado.

        La agrupación predeterminada es monthly.

        Los intervalos sin inspecciones revisadas devuelven
        una tasa de aprobación null.

        La agrupación temporal modifica exclusivamente la tendencia
        de aprobación. Los indicadores generales, la gráfica de
        incidencias y los listados conservan su comportamiento.

        La gráfica de riesgo se filtra por mes.

        Los indicadores y gráficas no autorizados se omiten.
        Los listados no autorizados son arreglos vacíos.

        Sin paginación.
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: month
          required: false
          description: Mes en formato YYYY-MM. Por defecto, el mes actual.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: '2026-11'
        - in: query
          name: granularity
          required: false
          description: Agrupación temporal de la tendencia de aprobación.
          schema:
            type: string
            enum:
              - weekly
              - monthly
              - yearly
            default: monthly
          example: weekly
      responses:
        '200':
          description: Estadísticas obtenidas correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: Contexto de organización requerido o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Usuario inactivo o sin acceso a la organización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===================================================================
  # ORGANIZATION
  # ===================================================================

  /reports/summary:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Obtener reporte estadístico consolidado
      description: 'Requiere reports.view o reports.view_own y respeta los permisos operativos y las ubicaciones
        asignadas. Las secciones no autorizadas son null. Fechas inclusivas: started_at para inspecciones,
        reported_at para incidencias y created_at para acciones correctivas. Los estados son actuales; el
        vencimiento se calcula respecto a hoy. Las tasas sin denominador son null. Los filtros deben pertenecer
        a la organización activa y ser coherentes. Sin paginación.'
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date_from
          required: true
          schema:
            type: string
            format: date
          description: Fecha inclusiva en formato YYYY-MM-DD.
        - in: query
          name: date_to
          required: true
          schema:
            type: string
            format: date
          description: Fecha inclusiva en formato YYYY-MM-DD.
        - in: query
          name: plant_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: area_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: production_line_id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reporte obtenido correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummaryResponse'
        '400':
          description: Contexto de organización requerido o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Acceso denegado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /plants:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Listar Plantas
      description: |
        Lista paginada de plantas del tenant activo. Requiere `plants.view`;
        sin `locations.view_all` solo incluye plantas asignadas al usuario.
        No devuelve áreas ni líneas anidadas.
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: status
          schema:
            type: boolean
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
        - in: query
          name: include_hierarchy
          deprecated: true
          schema:
            type: boolean
          description: |
            Parámetro heredado ignorado por el backend actual: no devuelve áreas
            ni líneas y no habilita la selección jerárquica remota de la PWA.
            Su futura retirada requiere una transición coordinada con consumidores.
      responses:
        '200':
          description: Lista de plantas obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plant'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '422':
          description: Parámetros de paginación inválidos; code validation_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crear Planta
      description: |
        Requiere usuario autenticado, organización cliente activa seleccionada
        mediante `X-Organization-Id`, membresía activa y permiso `plants.manage`.
        Solo admite atributos en el body JSON; rechaza cualquier parámetro query,
        archivo adjunto o campo adicional con 422 `validation_failed`.
        El código se recorta y convierte a mayúsculas antes de comprobar que
        contiene solo A-Z, 0-9 y guion ASCII, con máximo 50 caracteres.
        Un código duplicado en la organización, incluso con soft delete, se
        rechaza con 422; la garantía final es el índice `plants_org_code_unique`.
        Otros errores SQL no se convierten en validación.
      tags:
        - Organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantCreateInput'
            example:
              name: Planta Norte
              code: " pl-01 "
              address: Av. Industria 100
              description: null
      responses:
        '201':
          description: Planta creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/PlantCreated'
              example:
                data:
                  id: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
                  organization_id: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e40"
                  name: Planta Norte
                  code: PL-01
                  address: Av. Industria 100
                  description: null
                  status: true
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '422':
          description: Datos inválidos, campos adicionales, query o archivos no permitidos, o código duplicado en la organización; code validation_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ValidationFailed'

  /plants/{plantId}:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Obtener Planta
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      responses:
        '200':
          description: Detalle de la planta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Plant'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 'Sin acceso: usuario inactivo, organización no accesible o permiso
  
            insuficiente (las policies pueden responder 403 sin code).
  
            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Actualizar Planta
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministrationPlantUpdateInput'
      responses:
        '200':
          description: Planta actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdministrationPlant'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 'Sin acceso: usuario inactivo, organización no accesible o permiso
  
            insuficiente (las policies pueden responder 403 sin code).
  
            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '415':
          description: El Content-Type no es application/json; también se rechaza multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Actualiza parcialmente los campos permitidos. Requiere plants.manage. No permite modificar la organización, el padre ni el estado. No admite parámetros de consulta ni archivos adjuntos.

  /plants/{plantId}/status:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    patch:
      summary: Activar/Desactivar Planta
      description: Requiere plants.manage. Establece el estado explícitamente, sin cascada ni eliminación de registros históricos. La disponibilidad efectiva depende de los ancestros. No admite parámetros de consulta ni archivos adjuntos.
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministrationLocationStatusInput'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdministrationPlant'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
