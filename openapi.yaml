        answer:
          type: string
          nullable: true
          description: |
            Valor de la respuesta como string. La interpretación depende del `answer_type`:
            - `boolean`: "true" / "false".
            - `text`: texto libre.
            - `number`: número como string (ej. "12.5").
            - `multiple_choice`: valor de la opción seleccionada.
            - `signature`: datos de la firma (ej. URL o base64).
            - `date`: fecha ISO 8601.
          example: "false"
        observation:
          type: string
          maxLength: 65535
          nullable: true
          example: "El extintor de la zona norte está caducado."

