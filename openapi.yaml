                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ===================================================================
  # SYNC (Offline / PWA)
  # ===================================================================

  /sync/bootstrap:
    x-status: planned
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Descargar Snapshot Inicial
      description: >
        Retorna el snapshot inicial para la PWA: organizaciones, plantas, áreas,
        líneas de producción, checklists y normas, junto con un cursor inicial
        para sincronización incremental. Es el primer endpoint que consume la
        PWA al recuperar la conexión.
      tags:
        - Sync
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot inicial obtenido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      organizations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Organization'
                      plants:
                        type: array
                        items:
                          $ref: '#/components/schemas/Plant'
                      areas:
                        type: array
                        items:
                          $ref: '#/components/schemas/Area'
                      production_lines:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductionLine'
                      checklists:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChecklistBase'
                      norms:
                        type: array
                        items:
                          $ref: '#/components/schemas/Norm'
                      cursor:
                        $ref: '#/components/schemas/SyncCursor'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'

  /sync/changes:
    x-status: planned
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Descargar Cambios Incrementales
      description: >
        Retorna el flujo de cambios del servidor posteriores al cursor indicado.
        El cursor es opaco y lo emite el servidor. Permite a la PWA mantenerse
        sincronizada con los cambios realizados por otros dispositivos o por el
        panel web.
      tags:
        - Sync
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: integer
            format: int64
            minimum: 0
            description: Secuencia `seq` del último cambio procesado por el cliente.
          example: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Número máximo de cambios a devolver.
          example: 100
        - in: query
          name: resources
          schema:
            type: array
            items:
              type: string
              enum: [plants, areas, production_lines, checklists, checklist_versions, checklist_sections, questions, norms, norm_requirements, inspections, inspection_answers, incidents, evidences, corrective_actions, corrective_action_updates, audit_logs]
          description: Filtro opcional por tipo de recurso. Si se omite, se devuelve todo.
      responses:
        '200':
          description: Cambios obtenidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncChangeList'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'

  /sync/operations:
    x-status: planned
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    post:
      summary: Enviar Operaciones Pendientes
      description: >
        Recibe un lote de operaciones pendientes creadas offline por la PWA y
        devuelve un resultado individual por operación. Es idempotente: reenviar
        el mismo `operation_id` devuelve el mismo resultado sin duplicar efectos.
        Las operaciones se resuelven respetando `depends_on`.
      tags:
        - Sync
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Lote procesado. El estado HTTP es 200 aunque alguna operación falle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResponse'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '422':
          description: Datos inválidos o referencia a recursos de otra organización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ValidationFailed'
                crossTenantOperation:
                  $ref: '#/components/examples/CrossTenantRelation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /devices:
    x-status: planned
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Listar Dispositivos
      description: Obtiene los dispositivos registrados para sincronización.
      tags:
