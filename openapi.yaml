openapi: 3.0.3

info:
  title: Inspecta API
  description: |
    Contrato de API para el sistema Inspecta de gestión de inspecciones,
    incidencias, evidencias y acciones correctivas en plantas industriales.

    **Convenciones transversales:**

    - Todas las colecciones usan paginación con parámetros `page` y `per_page`
      (estándar Laravel API Resources) y devuelven el envelope `{data, meta}`.
    - El campo `status` es booleano (BD `TINYINT(1)`): `true` = activo, `false` = inactivo.
      La baja lógica se realiza enviando `{"status": false}` en endpoints `PATCH …/status`.
    - Los campos de auditoría (`user_id`, `created_by`, `reported_by`, `assigned_to`,
      `uploaded_by`) y `organization_id` se toman del token de acceso y no deben
      enviarse en el body. Un `organization_id` distinto al del token se rechaza
      con 422.
    - Aislamiento multi-tenant: la organización se deriva del token. Un recurso de
      otra organización se comporta como inexistente (404) y no revela su existencia.
    - Coordenadas con precisión de 7 decimales (BD `DECIMAL(10,7)`):
      latitud −90..90, longitud −180..180.
  version: 1.3.0

servers:
  - url: https://api.inspecta.com/v1
    description: Servidor de Producción
  - url: http://localhost:8000/api
    description: Servidor de Desarrollo Local

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Inicio y cierre de sesión, e identidad del usuario autenticado.
  - name: Organization
  - name: Users
  - name: Checklists
  - name: Norms
  - name: Inspections
  - name: Incidents
  - name: Evidences
  - name: Corrective Actions
  - name: Audit Logs
  - name: Sync

paths:

  # ===================================================================
  # AUTHENTICATION
  # ===================================================================

  /auth/login:
    post:
      summary: Iniciar sesión
      description: |
        Autentica las credenciales y emite un token personal de Sanctum.
        El token es opaco (`{id}|{40 caracteres}`), no un JWT.

        La ruta está limitada a 5 intentos por minuto y por combinación de
        email e IP. Los intentos fallidos consumen la cuota.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: inspector@inspecta-demo.com
              password: Inspector123!
      responses:
        '200':
          description: Autenticación exitosa.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '403':
          $ref: '#/components/responses/InactiveUserError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      summary: Cerrar sesión
      description: Revoca únicamente el token Bearer utilizado en la petición.
      tags:
        - Authentication
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/InactiveUserError'

  /auth/me:
    get:
      summary: Obtener el usuario autenticado
      description: |
        Devuelve la identidad del usuario dueño del token Bearer.
        Requiere que el usuario y su organización existan y estén activos.
      tags:
        - Authentication
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/AccessDeniedError'

  # ===================================================================
  # ORGANIZATION
  # ===================================================================

  /plants:
    get:
      summary: Listar Plantas
      description: Obtiene una lista paginada de todas las plantas registradas. Ideal para la sincronización offline.
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: include_hierarchy
          schema:
            type: boolean
          description: Si es true, retorna las áreas y líneas de producción anidadas.
      responses:
        '200':
          description: Lista de plantas obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plant'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Crear Planta
      tags:
        - Organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantInput'
      responses:
        '201':
          description: Planta creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Plant'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /plants/{plantId}:
    get:
      summary: Obtener Planta
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      responses:
        '200':
          description: Detalle de la planta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Plant'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Actualizar Planta
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantInput'
      responses:
        '200':
          description: Planta actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Plant'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Activar/Desactivar Planta
      description: Cambia el estado lógico de la planta (activa o inactiva).
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Plant'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /plants/{plantId}/areas:
    get:
      summary: Listar Áreas de una Planta
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Áreas listadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Area'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      summary: Crear Área
      description: Crea una nueva área asignada directamente a la planta especificada en la URL.
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/plantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaInput'
      responses:
        '201':
          description: Área creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Area'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /areas/{areaId}:
    get:
      summary: Obtener Área
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/areaIdParam'
      responses:
        '200':
          description: Detalle del área.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Area'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Actualizar Área
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/areaIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaInput'
      responses:
        '200':
          description: Área actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Area'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Activar/Desactivar Área
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/areaIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: boolean
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Area'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /areas/{areaId}/lines:
    get:
      summary: Listar Líneas de Producción de un Área
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/areaIdParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Líneas listadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionLine'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      summary: Crear Línea de Producción
      description: Crea una nueva línea de producción para el área especificada.
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/areaIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionLineInput'
      responses:
        '201':
          description: Línea de producción creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductionLine'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /production-lines/{productionLineId}:
    get:
      summary: Obtener Línea de Producción
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/productionLineIdParam'
      responses:
        '200':
          description: Detalle de la línea.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductionLine'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Actualizar Línea de Producción
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/productionLineIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionLineInput'
      responses:
        '200':
          description: Línea actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductionLine'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Activar/Desactivar Línea de Producción
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/productionLineIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: boolean
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductionLine'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ===================================================================
  # USERS
  # ===================================================================

  /users:
    get:
      summary: Listar Usuarios
      description: Obtiene una lista paginada de todos los usuarios registrados.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: status
          schema:
            type: boolean
          description: Filtrar por usuarios activos o inactivos.
      responses:
        '200':
          description: Lista de usuarios obtenida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Crear Usuario
      description: Crea un nuevo usuario. Permite enviar arreglos opcionales con IDs de roles, plantas y áreas para configurar sus permisos inmediatamente.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: Usuario creado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{userId}:
    get:
      summary: Obtener detalle de Usuario
      description: Retorna la información de un usuario, incluyendo los roles, plantas y áreas a las que tiene acceso.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      responses:
        '200':
          description: Detalle del usuario obtenido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Actualizar Usuario
      description: Actualiza información básica del usuario (Nombre, Email, Estado). No se usa para actualizar contraseñas.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Activar/Desactivar Usuario
      description: Cambia el estado lógico del usuario (activa o inactiva).
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: boolean
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/{userId}/password:
    put:
      summary: Cambiar Contraseña
      description: Actualiza la contraseña del usuario.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  example: "PasswordActual123!"
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 255
                  example: "NuevoPassword456!"
                new_password_confirmation:
                  type: string
                  format: password
                  example: "NuevoPassword456!"
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /roles:
    get:
      summary: Listar Roles
      description: Obtiene la lista paginada de roles disponibles para asignar a los usuarios.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Lista de roles obtenida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # ===================================================================
  # CHECKLISTS
  # ===================================================================

  /checklists:
    get:
      summary: Listar Checklists
      description: Obtiene la lista paginada de checklists disponibles.
      tags:
        - Checklists
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Lista de checklists obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChecklistBase'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Crear Checklist Base
      tags:
        - Checklists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistInput'
      responses:
        '201':
          description: Checklist creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChecklistBase'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /checklists/{checklistId}:
    get:
      summary: Obtener Checklist
      tags:
        - Checklists
      parameters:
        - $ref: '#/components/parameters/checklistIdParam'
      responses:
        '200':
          description: Checklist obtenido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChecklistBase'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Actualizar Checklist
      tags:
        - Checklists
      parameters:
        - $ref: '#/components/parameters/checklistIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistInput'
      responses:
        '200':
          description: Checklist actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChecklistBase'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Activar/Desactivar Checklist
      tags:
        - Checklists
      parameters:
        - $ref: '#/components/parameters/checklistIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: boolean
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChecklistBase'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /checklists/{checklistId}/versions:
    get:
      summary: Listar Versiones de un Checklist
      tags:
        - Checklists
      parameters:
        - $ref: '#/components/parameters/checklistIdParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Versiones listadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChecklistVersion'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      summary: Crear Versión de Checklist
      description: Crea una nueva versión del checklist en estado draft.
      tags:
        - Checklists
      parameters:
        - $ref: '#/components/parameters/checklistIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: string
                  maxLength: 20
                  example: "v1.1"
      responses:
        '201':
          description: Versión creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChecklistVersion'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /checklists/{checklistId}/versions/{versionId}:
    get:
      summary: Obtener Versión de Checklist
      tags:
        - Checklists
      parameters:
        - $ref: '#/components/parameters/checklistIdParam'
        - $ref: '#/components/parameters/checklistVersionIdParam'
      responses:
        '200':
          description: Versión obtenida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChecklistVersion'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Actualizar Versión de Checklist
      description: Actualiza los metadatos de la versión (número, estado draft).
      tags:
