        - $ref: '#/components/parameters/incidentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentStatusInput'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Incident'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===================================================================
  # EVIDENCES
  # ===================================================================

  /evidences:
    get:
      summary: Listar Evidencias
      description: Obtiene una lista paginada de evidencias con filtros opcionales.
      tags:
        - Evidences
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: inspection_id
          schema:
            type: string
            format: uuid
          description: Filtrar por inspección.
        - in: query
          name: inspection_answer_id
          schema:
            type: string
            format: uuid
          description: Filtrar por respuesta de inspección.
        - in: query
          name: incident_id
          schema:
            type: string
            format: uuid
          description: Filtrar por incidencia.
      responses:
        '200':
          description: Lista de evidencias obtenida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evidence'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Subir Evidencia Multimedia
      description: Endpoint especializado para la recepción de archivos (fotos, documentos). Utiliza form-data en lugar de JSON. El `uploaded_by` se toma del token JWT.
      tags:
        - Evidences
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvidenceUploadInput'
      responses:
        '201':
          description: Archivo subido y registrado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Evidence'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /evidences/{evidenceId}:
    get:
      summary: Obtener Evidencia
      description: Devuelve los metadatos de la evidencia, incluyendo `storage_path` (URL firmada para descarga).
      tags:
        - Evidences
      parameters:
        - in: path
          name: evidenceId
          required: true
          description: UUID de la evidencia
          schema:
            type: string
            format: uuid
            example: "018f8c9d-5555-7a8b-8000-112233445566"
      responses:
        '200':
          description: Evidencia obtenida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Evidence'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ===================================================================
  # CORRECTIVE ACTIONS
  # ===================================================================

  /corrective-actions:
    get:
      summary: Listar Acciones Correctivas
      description: Obtiene una lista paginada de acciones. Permite filtrar por asignado (Mis Tareas), por incidencia o por estado.
      tags:
        - Corrective Actions
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: assigned_to
          schema:
            type: string
            format: uuid
          description: Filtrar por el UUID del usuario responsable.
        - in: query
          name: incident_id
          schema:
            type: string
            format: uuid
          description: Filtrar por una incidencia específica.
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, verified]
      responses:
        '200':
          description: Listado obtenido exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CorrectiveAction'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Crear Acción Correctiva
      description: Asigna una nueva tarea correctiva derivada de una incidencia.
      tags:
        - Corrective Actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectiveActionInput'
      responses:
        '201':
          description: Acción correctiva asignada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CorrectiveAction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /corrective-actions/{actionId}:
    get:
      summary: Detalle de Acción Correctiva
      description: Muestra los datos de la tarea y todo el historial de actualizaciones y comentarios.
      tags:
        - Corrective Actions
      parameters:
        - $ref: '#/components/parameters/actionIdParam'
      responses:
        '200':
          description: Detalle obtenido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CorrectiveActionDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Actualizar Acción Correctiva
      description: Permite editar la descripción, prioridad, fecha límite o reasignar la tarea.
      tags:
        - Corrective Actions
      parameters:
        - $ref: '#/components/parameters/actionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectiveActionInput'
      responses:
        '200':
          description: Acción actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CorrectiveAction'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /corrective-actions/{actionId}/updates:
    get:
      summary: Listar Actualizaciones de una Acción
      tags:
        - Corrective Actions
      parameters:
        - $ref: '#/components/parameters/actionIdParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Actualizaciones listadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CorrectiveActionUpdate'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      summary: Registrar Actualización / Avance
      description: Permite al responsable agregar un comentario sobre la tarea y avanzar su estado (ej. de pendiente a completada). El `user_id` se toma del token JWT.
      tags:
        - Corrective Actions
      parameters:
        - $ref: '#/components/parameters/actionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectiveActionUpdateInput'
      responses:
        '201':
          description: Avance registrado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CorrectiveActionUpdate'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===================================================================
  # AUDIT LOGS
  # ===================================================================

  /audit-logs:
    get:
      summary: Listar Registros de Auditoría
      description: Obtiene el historial de cambios en el sistema. Los resultados pueden filtrarse por usuario, modelo afectado o tipo de acción.
      tags:
        - Audit Logs
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: user_id
          schema:
            type: string
            format: uuid
          description: Filtrar acciones realizadas por un usuario específico.
        - in: query
          name: auditable_type
          schema:
            type: string
          description: Filtrar por modelo (ej. 'Inspection', 'Incident', 'User').
          example: "Inspection"
        - in: query
          name: auditable_id
          schema:
            type: string
            format: uuid
          description: Filtrar por el ID del recurso afectado.
        - in: query
          name: action
          schema:
            type: string
            enum: [created, updated, deleted]
          description: Tipo de operación realizada.
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          description: Fecha de inicio del rango (inclusive).
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          description: Fecha de fin del rango (inclusive).
      responses:
        '200':
          description: Listado de auditoría obtenido exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /audit-logs/{logId}:
    get:
      summary: Detalle de Registro de Auditoría
      description: Obtiene los detalles exactos de un cambio, incluyendo el estado anterior y nuevo de los campos modificados.
      tags:
        - Audit Logs
      parameters:
        - $ref: '#/components/parameters/logIdParam'
      responses:
        '200':
          description: Detalle del log obtenido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuditLog'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ===================================================================
  # ORGANIZATIONS
  # ===================================================================

  /organizations:
    get:
      summary: Listar Organizaciones
      description: Obtiene una lista paginada de organizaciones. Cada organización es el raíz de separación de responsabilidades (multi-tenancy).
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: status
          schema:
            type: boolean
          description: Filtrar por organizaciones activas o inactivas.
      responses:
        '200':
          description: Lista de organizaciones obtenida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Crear Organización
      description: Crea una nueva empresa u organización.
      tags:
        - Organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Organización creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organizationId}:
    get:
      summary: Obtener Organización
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/organizationIdParam'
      responses:
        '200':
          description: Detalle de la organización.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Actualizar Organización
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/organizationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Organización actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Activar/Desactivar Organización
      description: Cambia el estado lógico de la organización (activa o inactiva).
      tags:
        - Organization
      parameters:
        - $ref: '#/components/parameters/organizationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ===================================================================
  # SYNC (Offline / PWA)
  # ===================================================================

  /sync/bootstrap:
    get:
      summary: Descargar Snapshot Inicial
      description: >
        Retorna el snapshot inicial para la PWA: organizaciones, plantas, áreas,
        líneas de producción, checklists y normas, junto con un cursor inicial
        para sincronización incremental. Es el primer endpoint que consume la
        PWA al recuperar la conexión.
      tags:
        - Sync
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot inicial obtenido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      organizations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Organization'
                      plants:
                        type: array
                        items:
                          $ref: '#/components/schemas/Plant'
                      areas:
                        type: array
                        items:
                          $ref: '#/components/schemas/Area'
                      production_lines:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductionLine'
                      checklists:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChecklistBase'
                      norms:
                        type: array
                        items:
                          $ref: '#/components/schemas/Norm'
                      cursor:
                        $ref: '#/components/schemas/SyncCursor'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /sync/changes:
    get:
      summary: Descargar Cambios Incrementales
      description: >
        Retorna el flujo de cambios del servidor posteriores al cursor indicado.
        El cursor es opaco y lo emite el servidor. Permite a la PWA mantenerse
        sincronizada con los cambios realizados por otros dispositivos o por el
        panel web.
      tags:
        - Sync
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: integer
            format: int64
            minimum: 0
            description: Secuencia `seq` del último cambio procesado por el cliente.
          example: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Número máximo de cambios a devolver.
          example: 100
        - in: query
          name: resources
          schema:
            type: array
            items:
              type: string
              enum: [plants, areas, production_lines, checklists, checklist_versions, checklist_sections, questions, norms, norm_requirements, inspections, inspection_answers, incidents, evidences, corrective_actions, corrective_action_updates, audit_logs]
          description: Filtro opcional por tipo de recurso. Si se omite, se devuelve todo.
      responses:
        '200':
          description: Cambios obtenidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncChangeList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /sync/operations:
    post:
      summary: Enviar Operaciones Pendientes
      description: >
        Recibe un lote de operaciones pendientes creadas offline por la PWA y
        devuelve un resultado individual por operación. Es idempotente: reenviar
        el mismo `operation_id` devuelve el mismo resultado sin duplicar efectos.
        Las operaciones se resuelven respetando `depends_on`.
      tags:
        - Sync
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Lote procesado. El estado HTTP es 200 aunque alguna operación falle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /devices:
    get:
      summary: Listar Dispositivos
      description: Obtiene los dispositivos registrados para sincronización.
      tags:
        - Sync
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Lista de dispositivos obtenida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Registrar Dispositivo
      description: Registra un dispositivo móvil para habilitar la sincronización offline.
      tags:
        - Sync
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInput'
      responses:
        '201':
          description: Dispositivo registrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /devices/{deviceId}:
    get:
      summary: Obtener Dispositivo
      tags:
        - Sync
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deviceIdParam'
      responses:
        '200':
          description: Detalle del dispositivo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token personal de Sanctum con formato `{id}|{40 caracteres}`.
        No es un JWT: debe enviarse tal cual lo devuelve `POST /auth/login`
        en `data.token`. Se revoca con `POST /auth/logout`.

  headers:
    RateLimitLimit:
      description: Peticiones permitidas en la ventana actual.
      schema:
        type: integer
        example: 5
    RateLimitRemaining:
      description: Peticiones restantes en la ventana actual.
      schema:
        type: integer
        example: 4

  parameters:
    plantIdParam:
      in: path
      name: plantId
      required: true
      description: UUID de la planta
      schema:
        type: string
        format: uuid
        example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
    areaIdParam:
      in: path
      name: areaId
      required: true
      description: UUID del área
      schema:
        type: string
        format: uuid
        example: "018f1a2c-1111-7e5f-8000-abcdef123456"
    productionLineIdParam:
      in: path
      name: productionLineId
      required: true
      description: UUID de la línea de producción
      schema:
        type: string
        format: uuid
        example: "018f1a2d-2222-7e5f-8000-fedcba654321"
    userIdParam:
      in: path
      name: userId
      required: true
      description: UUID del usuario
      schema:
        type: string
        format: uuid
        example: "018f2b3c-4d5e-7f8a-8000-112233445566"
    checklistIdParam:
      in: path
      name: checklistId
      required: true
      description: UUID del checklist
      schema:
        type: string
        format: uuid
        example: "018f3d4e-1234-7a8b-8000-abcdef123456"
    checklistVersionIdParam:
      in: path
      name: versionId
      required: true
      description: UUID de la versión del checklist
      schema:
        type: string
        format: uuid
        example: "018f3d5e-4321-7a8b-8000-aabbccddeeff"
    sectionIdParam:
      in: path
      name: sectionId
      required: true
      description: UUID de la sección
      schema:
        type: string
        format: uuid
        example: "018f3e5f-9999-7a8b-8000-112233445566"
    questionIdParam:
      in: path
      name: questionId
      required: true
      description: UUID de la pregunta del checklist
      schema:
        type: string
        format: uuid
        example: "018f4e5f-5678-7a8b-8000-fedcba654321"
    normIdParam:
      in: path
      name: normId
      required: true
      description: UUID de la Norma principal
      schema:
        type: string
        format: uuid
        example: "018f5e6a-9999-7a8b-8000-abcdef123456"
    normRequirementIdParam:
      in: path
      name: requirementId
      required: true
      description: UUID del requerimiento normativo
      schema:
        type: string
        format: uuid
        example: "018f5f6a-1111-7a8b-8000-123456789abc"
    inspectionIdParam:
      in: path
      name: inspectionId
      required: true
      description: UUID de la inspección
      schema:
        type: string
        format: uuid
        example: "018f6a7b-2222-7a8b-8000-abcdef123456"
    incidentIdParam:
      in: path
      name: incidentId
      required: true
      description: UUID de la incidencia
      schema:
        type: string
        format: uuid
        example: "018f7b8c-4444-7a8b-8000-abcdef123456"
    actionIdParam:
      in: path
      name: actionId
      required: true
      description: UUID de la acción correctiva
      schema:
        type: string
        format: uuid
        example: "018f9a1b-6666-7a8b-8000-abcdef123456"
    logIdParam:
      in: path
      name: logId
      required: true
      description: UUID del registro de auditoría
      schema:
        type: string
        format: uuid
        example: "018fa1b2-3333-7a8b-8000-abcdef123456"
    organizationIdParam:
      in: path
      name: organizationId
      required: true
      description: UUID de la organización
      schema:
        type: string
        format: uuid
        example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
    deviceIdParam:
      in: path
      name: deviceId
      required: true
      description: UUID del dispositivo
      schema:
        type: string
        format: uuid
        example: "018f9c1d-1111-7a8b-8000-aabbccddeeff"
    pageParam:
      in: query
      name: page
      required: false
      description: Número de página (1-indexado)
      schema:
        type: integer
        minimum: 1
        default: 1
    perPageParam:
      in: query
      name: per_page
      required: false
      description: Elementos por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15

  responses:
    UnauthorizedError:
      description: No autenticado. Token de acceso ausente, inválido o revocado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tokenAusente:
              summary: Sin cabecera Authorization
              value:
                message: "No autenticado. Token de acceso ausente."
            tokenInvalido:
              summary: Token inexistente o revocado
              value:
                message: "No autenticado. Token de acceso inválido."
    InvalidCredentialsError:
      description: El email no existe o la contraseña es incorrecta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Las credenciales proporcionadas son incorrectas."
    InactiveUserError:
      description: Credenciales válidas, pero el usuario tiene `status = false`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "El usuario está inactivo. Contacte al administrador."
    AccessDeniedError:
      description: |
        Acceso denegado por el estado del usuario o de su organización.
        El usuario debe existir, estar activo y pertenecer a una organización
        existente y activa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            usuarioInactivo:
              value:
                message: "El usuario está inactivo. Contacte al administrador."
            organizacionInactiva:
              value:
                message: "La organización está inactiva. Contacte al administrador."
            organizacionInexistente:
              value:
                message: "La organización del usuario no existe."
            sinOrganizacion:
              value:
                message: "El usuario no tiene una organización asignada."
    ForbiddenError:
      description: Prohibido. No tienes permiso para realizar esta acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "This action is unauthorized."
    NotFoundError:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Recurso no encontrado."
    ValidationError:
      description: Error de validación en los datos enviados.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Los datos proporcionados no son válidos."
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  code: ["El código PLN-01 ya ha sido registrado."]
    TooManyRequests:
      description: |
        Límite de peticiones excedido. La respuesta actual del backend no
        incluye `Retry-After` ni `X-RateLimit-*`: el cliente debe aplicar su
        propio backoff. En `POST /auth/login` el límite es de 5 intentos por
        minuto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Too Many Attempts."
    ServiceUnavailable:
      description: Servicio temporalmente no disponible. El cliente debe reintentar más tarde.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Servicio temporalmente no disponible."

  schemas:

    # -------------------------------------------------------------------
    # Authentication
    # -------------------------------------------------------------------

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 150
          example: inspector@inspecta-demo.com
        password:
          type: string
          example: Inspector123!

    AuthUser:
      type: object
      description: Identidad mínima del usuario autenticado.
      required:
        - id
        - name
        - email
        - organization_id
      properties:
        id:
          type: string
          format: uuid
          example: "018f2b3c-4d5e-7f8a-8000-112233445591"
        name:
          type: string
          maxLength: 150
          example: "Inspector Demo"
        email:
          type: string
          format: email
          maxLength: 150
          example: inspector@inspecta-demo.com
        organization_id:
          type: string
          format: uuid
          description: Organización a la que pertenece el usuario. Es la raíz del aislamiento multi-tenancy.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"

    LoginResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: "Autenticación exitosa."
        data:
          type: object
          required:
            - user
            - token
          properties:
            user:
              $ref: '#/components/schemas/AuthUser'
            token:
              type: string
              description: Token personal de Sanctum con formato `{id}|{40 caracteres}`.
              example: "1|xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

    MeResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: "Usuario autenticado."
        data:
          $ref: '#/components/schemas/AuthUser'

    LogoutResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Sesión cerrada correctamente."

    # -------------------------------------------------------------------
    # Common
    # -------------------------------------------------------------------

    Error:
      type: object
      properties:
        message:
          type: string
          example: "Mensaje de error."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      description: Metadatos de paginación (estándar Laravel API Resources).
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 4
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 52

    # -------------------------------------------------------------------
    # Organization
    # -------------------------------------------------------------------

    Organization:
      type: object
      description: Empresa u organización. Es la raíz de la separación de responsabilidades por organización (multi-tenancy).
      properties:
        id:
          type: string
          format: uuid
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        name:
          type: string
          maxLength: 150
          example: "Constructora del Norte S.A. de C.V."
        code:
          type: string
          maxLength: 50
          example: "CN-01"
        tax_id:
          type: string
          maxLength: 50
          nullable: true
          example: "ABC123456789"
        address:
          type: string
          nullable: true
          example: "Av. Industria 100, Jalisco"
        description:
          type: string
          nullable: true
          example: "Empresa constructora principal"
        phone:
          type: string
          maxLength: 50
          nullable: true
          example: "+52 33 1234 5678"
        email:
          type: string
          maxLength: 150
          nullable: true
          example: "contacto@constructoranorte.com"
        status:
          type: boolean
          example: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de baja lógica (soft delete). Nulo si la organización está activa.
          example: null
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-01T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-01T09:00:00Z"

    OrganizationInput:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          maxLength: 150
          example: "Constructora del Norte S.A. de C.V."
        code:
          type: string
          maxLength: 50
          example: "CN-01"
        tax_id:
          type: string
          maxLength: 50
          nullable: true
          example: "ABC123456789"
        address:
          type: string
          nullable: true
          example: "Av. Industria 100, Jalisco"
        description:
          type: string
          nullable: true
          example: "Empresa constructora principal"
        phone:
          type: string
          maxLength: 50
          nullable: true
          example: "+52 33 1234 5678"
        email:
          type: string
          maxLength: 150
          nullable: true
          example: "contacto@constructoranorte.com"
        status:
          type: boolean
          default: true
          example: true

    # -------------------------------------------------------------------
    # Plant
    # -------------------------------------------------------------------

    Plant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece la planta.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        name:
          type: string
          maxLength: 150
          example: "Planta Norte"
        code:
          type: string
          maxLength: 50
          example: "PLN-01"
        address:
          type: string
          nullable: true
          example: "Av. Industria 100, Jalisco"
        description:
          type: string
          nullable: true
          example: "Planta principal de manufactura"
        status:
          type: boolean
          example: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de baja lógica (soft delete). Nulo si la planta está activa.
          example: null
        areas:
          type: array
          nullable: true
          description: "Opcional. Se devuelve si se solicita la jerarquía."
          items:
            $ref: '#/components/schemas/Area'
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-01T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-01T09:00:00Z"

    PlantInput:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          maxLength: 150
          example: "Planta Norte"
        code:
          type: string
          maxLength: 50
          example: "PLN-01"
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: ID de la organización. Si no se envía, se toma del token JWT del usuario autenticado.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        address:
          type: string
          nullable: true
          example: "Av. Industria 100, Jalisco"
        description:
          type: string
          nullable: true
          example: "Planta principal de manufactura"

    Area:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f1a2c-1111-7e5f-8000-abcdef123456"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece el área.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        plant_id:
          type: string
          format: uuid
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        name:
          type: string
          maxLength: 150
          example: "Área de Soldadura"
        code:
          type: string
          maxLength: 50
          example: "AR-SOLD-01"
        type:
          type: string
          enum: [production, warehouse, administrative, maintenance, outdoor]
          example: "production"
        description:
          type: string
          nullable: true
          example: "Zona de soldadura robótica"
        status:
          type: boolean
          example: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de baja lógica (soft delete). Nulo si el área está activa.
          example: null
        production_lines:
          type: array
          nullable: true
          description: "Opcional. Jerarquía inferior."
          items:
            $ref: '#/components/schemas/ProductionLine'
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    AreaInput:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          maxLength: 150
          example: "Área de Soldadura"
        code:
          type: string
          maxLength: 50
          example: "AR-SOLD-01"
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: ID de la organización. Si no se envía, se toma del token JWT del usuario autenticado.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        type:
          type: string
          enum: [production, warehouse, administrative, maintenance, outdoor]
          example: "production"
        description:
          type: string
          nullable: true
          example: "Zona de soldadura robótica"

    ProductionLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f1a2d-2222-7e5f-8000-fedcba654321"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece la línea de producción.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        area_id:
          type: string
          format: uuid
          example: "018f1a2c-1111-7e5f-8000-abcdef123456"
        name:
          type: string
          maxLength: 150
          example: "Línea Automotriz A"
        code:
          type: string
          maxLength: 50
          example: "LN-AUT-A"
        description:
          type: string
          nullable: true
          example: "Ensamblaje de chasis"
        status:
          type: boolean
          example: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de baja lógica (soft delete). Nulo si la línea está activa.
          example: null
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    ProductionLineInput:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          maxLength: 150
          example: "Línea Automotriz A"
        code:
          type: string
          maxLength: 50
          example: "LN-AUT-A"
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: ID de la organización. Si no se envía, se toma del token JWT del usuario autenticado.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        description:
          type: string
          nullable: true
          example: "Ensamblaje de chasis"

    # -------------------------------------------------------------------
    # Users
    # -------------------------------------------------------------------

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f2b3c-4d5e-7f8a-8000-112233445566"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece el usuario.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        name:
          type: string
          maxLength: 150
          example: "Ulises Arturo Rocha"
        email:
          type: string
          format: email
          maxLength: 150
          example: "ulises.rocha@inspecta.com"
        status:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            roles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
            assigned_plants:
              type: array
              items:
                $ref: '#/components/schemas/Plant'
            assigned_areas:
              type: array
              items:
                $ref: '#/components/schemas/Area'

    UserCreateInput:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          maxLength: 150
          example: "Yajaira Estrada"
        email:
          type: string
          format: email
          maxLength: 150
          example: "yajaira.estrada@inspecta.com"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          example: "PasswordSeguro123!"
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: ID de la organización. Si no se envía, se toma del token JWT del usuario autenticado.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        roles:
          type: array
          description: Arreglo de IDs de roles a asignar (opcional).
          items:
            type: string
            format: uuid
        assigned_plants:
          type: array
          description: Arreglo de IDs de plantas a asignar (opcional).
          items:
            type: string
            format: uuid
        assigned_areas:
          type: array
          description: Arreglo de IDs de áreas a asignar (opcional).
          items:
            type: string
            format: uuid

    UserUpdateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          example: "Ulises Arturo Rocha Garcia"
        email:
          type: string
          format: email
          maxLength: 150
          example: "ulises.rocha@inspecta.com"
        status:
          type: boolean
          example: true

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f2b3c-9999-7f8a-8000-112233445566"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece el rol.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        name:
          type: string
          maxLength: 50
          example: "Inspector"
        description:
          type: string
          nullable: true
          example: "Puede realizar inspecciones y reportar incidencias"
        status:
          type: boolean
          example: true

    # -------------------------------------------------------------------
    # Checklists
    # -------------------------------------------------------------------

    ChecklistBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f3d4e-1234-7a8b-8000-abcdef123456"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece el checklist.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        name:
          type: string
          maxLength: 150
          example: "Inspección de EHS Semanal"
        description:
          type: string
          nullable: true
          example: "Revisión rutinaria de equipo de protección personal y extintores."
        status:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    ChecklistInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 150
          example: "Inspección de EHS Semanal"
        description:
          type: string
          nullable: true
          example: "Revisión rutinaria de equipo de protección personal y extintores."
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: ID de la organización. Si no se envía, se toma del token JWT del usuario autenticado.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"

    ChecklistVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f3d5e-4321-7a8b-8000-aabbccddeeff"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece la versión del checklist.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        checklist_id:
          type: string
          format: uuid
          example: "018f3d4e-1234-7a8b-8000-abcdef123456"
        version:
          type: string
          maxLength: 20
          example: "v1.2"
        status:
          type: string
          enum: [draft, published, archived]
          example: "published"
        created_by:
          type: string
          format: uuid
          description: ID del usuario que creó la versión (BD checklist_versions.created_by).
          example: "018f2b3c-4d5e-7f8a-8000-112233445566"
        published_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-10T14:30:00Z"
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    ChecklistSection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f3e5f-9999-7a8b-8000-112233445566"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece la sección.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        checklist_version_id:
          type: string
          format: uuid
          example: "018f3d5e-4321-7a8b-8000-aabbccddeeff"
        name:
          type: string
          maxLength: 150
          example: "1. Equipos de Emergencia"
        description:
          type: string
          nullable: true
          example: "Validación de extintores y mangueras."
        display_order:
          type: integer
          minimum: 0
          example: 1
        status:
          type: boolean
          example: true
        questions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Question'
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    Question:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "018f4e5f-5678-7a8b-8000-fedcba654321"
        organization_id:
          type: string
          format: uuid
          description: ID de la organización a la que pertenece la pregunta.
          example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
        checklist_section_id:
          type: string
          format: uuid
          example: "018f3e5f-9999-7a8b-8000-112233445566"
        question_text:
          type: string
          maxLength: 65535
          example: "¿Todos los extintores tienen carga vigente y marchamo de seguridad?"
        description:
          type: string
          nullable: true
          example: "Verifique visualmente la etiqueta de inspección mensual."
        answer_type:
          type: string
          enum: [boolean, text, number, multiple_choice, signature, date]
          description: |
            Tipo de respuesta esperado:
