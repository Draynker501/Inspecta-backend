          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        inspector_name:
          type: string
          nullable: true
        plant_name:
          type: string
          nullable: true
        area_name:
