    LogoutResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Sesión cerrada correctamente."

    # -------------------------------------------------------------------
    # Common
    # -------------------------------------------------------------------

    ErrorCode:
      type: string
      description: |
        Código estable de error del catálogo (D-31b, D-31c). Los clientes
        deben decidir por `code` y nunca por el texto de `message`.

        Presente en todos los errores del catálogo. Las respuestas fuera
        del catálogo (403 de policies, 405, 500) pueden omitirlo.

        - `unauthenticated` (401): token ausente, inválido, revocado o
          perteneciente a un usuario globalmente desactivado.
        - `invalid_credentials` (401): login con email o contraseña incorrectos.
        - `user_inactive` (403): usuario con status = false; se emite únicamente
          en login, después de validar la contraseña. Un token emitido a un
          usuario que luego se desactiva deja de autenticar y responde
          `unauthenticated` (401) en la siguiente petición (D-44, M2.5).
        - `validation_failed` (422): error de validación; el sobre incluye
          `errors` con el detalle por campo.
        - `too_many_attempts` (429): límite de intentos excedido; incluye
          la cabecera Retry-After.
        - `not_found` (404): recurso inexistente o de otra organización; el
          mensaje no distingue el caso.
        - `cross_tenant_operation` (422): operación sobre datos de otra
          organización; tiene dos textos posibles.
        - `organization_required` (400): falta la cabecera X-Organization-Id.
        - `organization_invalid` (400): X-Organization-Id no es un UUID válido.
        - `organization_access_denied` (403): sin acceso a la organización
          indicada (inexistente, eliminada, inactiva o sin membresía activa).
        - `organization_not_tenant` (403): la organización indicada no es de
          tipo cliente.
        - `forbidden` (403): autorización denegada por policy (Gate). Mensaje
          fijo y unificado; no se reutiliza el mensaje de la excepción.

        Regla transversal: el mismo código produce siempre el mismo estado
        HTTP y el mismo texto de message en toda la API.
      enum:
        - unauthenticated
        - invalid_credentials
        - user_inactive
        - validation_failed
        - too_many_attempts
        - not_found
        - cross_tenant_operation
        - organization_required
        - organization_invalid
        - organization_access_denied
        - organization_not_tenant
        - forbidden

    Error:
      type: object
      description: |
        Sobre de error uniforme: `{ message, code, errors? }`. `code`
        identifica el error de forma estable (ver ErrorCode); `message` es
        solo informativo. `errors` solo aparece con `validation_failed`.
      required:
        - message
      properties:
        message:
          type: string
          description: Texto humano del error. No usarlo para lógica de cliente.
          example: "Mensaje de error."
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: object
          description: Solo presente con code validation_failed. Detalle por campo.
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      description: Metadatos de paginación (estándar Laravel API Resources).
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 4
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 52

