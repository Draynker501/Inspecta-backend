        requieren `inspections.manage`. `locations.view_all` no sustituye la
        asignación. Se rechazan parámetros desconocidos. Orden descendente por
        `created_at` e `id`; `per_page` predeterminado 15, máximo 100.
      tags:
        - Inspections
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, completed, confirmed, rejected]
          description: Filtrar inspecciones por estado.
        - in: query
          name: plant_id
          schema:
            type: string
            format: uuid
          description: Filtrar inspecciones por planta.
        - in: query
          name: area_id
          schema:
            type: string
            format: uuid
          description: Filtrar inspecciones por área.
      responses:
        '200':
          description: Lista de inspecciones obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InspectionOnline'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
