          type: string
          enum: [confirm, reject]
          description: |
            `confirm`: marca la inspección como `confirmed` y registra `supervisor_confirmed_at`.
            `reject`: marca la inspección como `rejected` y registra `rejected_at`.
            Solo inspecciones en estado `completed` pueden ser evaluadas.
          example: "confirm"
        supervisor_observations:
          type: string
          maxLength: 65535
          nullable: true
          example: "Revisado. Las medidas de seguridad son aceptables."

