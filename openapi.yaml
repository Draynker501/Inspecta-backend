components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token personal de Sanctum con formato `{id}|{40 caracteres}`.
        No es un JWT: debe enviarse tal cual lo devuelve `POST /auth/login`
        en `data.token`. Se revoca con `POST /auth/logout`.

  headers:
    RateLimitLimit:
      description: Peticiones permitidas en la ventana actual.
      schema:
        type: integer
        example: 5
    RateLimitRemaining:
      description: Peticiones restantes en la ventana actual.
      schema:
        type: integer
        example: 4

  parameters:
    organizationIdHeader:
      in: header
      name: X-Organization-Id
      required: true
      description: UUID de la organización activa (tenant). Obligatoria en rutas de dominio (grupo api.tenant); ausente en /auth/login, /auth/logout, /auth/me y /auth/organizations.
      schema:
        type: string
        format: uuid

    plantIdParam:
      in: path
      name: plantId
      required: true
      description: UUID de la planta
      schema:
        type: string
        format: uuid
        example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
    areaIdParam:
      in: path
      name: areaId
      required: true
      description: UUID del área
      schema:
        type: string
        format: uuid
        example: "018f1a2c-1111-7e5f-8000-abcdef123456"
    productionLineIdParam:
      in: path
      name: productionLineId
      required: true
      description: UUID de la línea de producción
      schema:
        type: string
        format: uuid
        example: "018f1a2d-2222-7e5f-8000-fedcba654321"
    userIdParam:
      in: path
      name: userId
      required: true
      description: UUID del usuario
      schema:
        type: string
        format: uuid
        example: "018f2b3c-4d5e-7f8a-8000-112233445566"
    checklistIdParam:
      in: path
      name: checklistId
      required: true
      description: UUID del checklist
      schema:
        type: string
        format: uuid
        example: "018f3d4e-1234-7a8b-8000-abcdef123456"
    checklistVersionIdParam:
      in: path
      name: versionId
      required: true
      description: UUID de la versión del checklist
      schema:
        type: string
        format: uuid
        example: "018f3d5e-4321-7a8b-8000-aabbccddeeff"
    sectionIdParam:
      in: path
      name: sectionId
      required: true
      description: UUID de la sección
      schema:
        type: string
        format: uuid
        example: "018f3e5f-9999-7a8b-8000-112233445566"
    questionIdParam:
      in: path
      name: questionId
      required: true
      description: UUID de la pregunta del checklist
      schema:
        type: string
        format: uuid
        example: "018f4e5f-5678-7a8b-8000-fedcba654321"
    normIdParam:
      in: path
      name: normId
      required: true
      description: UUID de la Norma principal
      schema:
        type: string
        format: uuid
        example: "018f5e6a-9999-7a8b-8000-abcdef123456"
    normRequirementIdParam:
      in: path
      name: requirementId
      required: true
      description: UUID del requerimiento normativo
      schema:
        type: string
        format: uuid
        example: "018f5f6a-1111-7a8b-8000-123456789abc"
    inspectionIdParam:
      in: path
      name: inspectionId
      required: true
      description: UUID de la inspección
      schema:
        type: string
        format: uuid
        example: "018f6a7b-2222-7a8b-8000-abcdef123456"
    incidentIdParam:
      in: path
      name: incidentId
      required: true
      description: UUID de la incidencia
      schema:
        type: string
        format: uuid
        example: "018f7b8c-4444-7a8b-8000-abcdef123456"
    actionIdParam:
      in: path
      name: actionId
      required: true
      description: UUID de la acción correctiva
      schema:
        type: string
        format: uuid
        example: "018f9a1b-6666-7a8b-8000-abcdef123456"
    logIdParam:
      in: path
      name: logId
      required: true
      description: UUID del registro de auditoría
      schema:
        type: string
        format: uuid
        example: "018fa1b2-3333-7a8b-8000-abcdef123456"
    organizationIdParam:
      in: path
      name: organizationId
      required: true
      description: UUID de la organización
      schema:
        type: string
        format: uuid
        example: "018f1a2b-3c4d-7e5f-8000-9a8b7c6d5e4f"
    deviceIdParam:
      in: path
      name: deviceId
      required: true
      description: UUID del dispositivo
      schema:
        type: string
        format: uuid
        example: "018f9c1d-1111-7a8b-8000-aabbccddeeff"
    pageParam:
      in: query
      name: page
      required: false
      description: Número de página (1-indexado)
      schema:
        type: integer
        minimum: 1
        default: 1
    perPageParam:
      in: query
      name: per_page
      required: false
      description: Elementos por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    answersPerPageParam:
      in: query
      name: per_page
      required: false
      description: |
        Elementos por página. El listado de respuestas de una inspección
        devuelve 100 elementos por página de forma predeterminada; el máximo
        admisible es 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100

  examples:
    Unauthenticated:
      summary: Token ausente, inválido o revocado (401).
      value:
        message: "No autenticado. Token de acceso ausente o inválido."
        code: unauthenticated
    InvalidCredentials:
      summary: Credenciales incorrectas (401).
      value:
        message: "Las credenciales proporcionadas son incorrectas."
        code: invalid_credentials
    UserInactive:
      summary: Usuario inactivo (403).
      value:
        message: "El usuario está inactivo. Contacte al administrador."
        code: user_inactive
    ValidationFailed:
      summary: Error de validación (422).
      value:
        message: "El correo electrónico es obligatorio."
        code: validation_failed
        errors:
          email: ["El correo electrónico es obligatorio."]
    TooManyAttempts:
      summary: Límite de intentos excedido (429).
      value:
        message: "Demasiados intentos. Inténtalo de nuevo más tarde."
        code: too_many_attempts
    NotFound:
      summary: Recurso inexistente o de otra organización (404).
      value:
        message: "Recurso no encontrado."
        code: not_found
    CrossTenantWrite:
      summary: Escritura sobre otra organización (422).
      value:
        message: "La operación intenta escribir datos de otra organización."
        code: cross_tenant_operation
    CrossTenantRelation:
      summary: Referencia a un recurso de otra organización (422).
      value:
        message: "El campo 'plant_id' referencia un recurso inexistente o de otra organización."
        code: cross_tenant_operation
    OrganizationRequired:
      summary: Falta la cabecera X-Organization-Id (400).
      value:
        message: "Cabecera X-Organization-Id requerida."
        code: organization_required
    OrganizationInvalid:
      summary: X-Organization-Id no es un UUID válido (400).
      value:
        message: "El identificador de organización no es un UUID válido."
        code: organization_invalid
    OrganizationAccessDenied:
      summary: Sin acceso a la organización indicada (403).
      value:
        message: "No tienes acceso a la organización indicada."
        code: organization_access_denied
    OrganizationNotTenant:
      summary: La organización indicada no es de tipo cliente (403).
      value:
        message: "No tienes acceso a la organización indicada."
        code: organization_not_tenant
    ForbiddenPolicy:
      summary: Permiso insuficiente, fuera del catálogo (403).
      value:
        message: "This action is unauthorized."
    ServiceUnavailableExample:
      summary: Servicio no disponible, fuera del catálogo (503).
      value:
        message: "Servicio temporalmente no disponible."

  responses:
    UnauthorizedError:
      description: No autenticado. Token de acceso ausente, inválido o revocado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              $ref: '#/components/examples/Unauthenticated'
    InvalidCredentialsError:
      description: El email no existe o la contraseña es incorrecta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidCredentials:
              $ref: '#/components/examples/InvalidCredentials'
    InactiveUserError:
      description: Credenciales válidas, pero el usuario tiene `status = false`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            userInactive:
              $ref: '#/components/examples/UserInactive'
    ValidationError:
      description: Error de validación en los datos enviados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validationFailed:
              $ref: '#/components/examples/ValidationFailed'
    TooManyRequests:
      description: |
        Límite de peticiones excedido. Incluye Retry-After (segundos hasta
        poder reintentar) y X-RateLimit-*. En `POST /auth/login` el límite es
        de 5 intentos por minuto.
      headers:
        Retry-After:
          description: Segundos que el cliente debe esperar antes de reintentar.
          schema:
            type: integer
            example: 60
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tooManyAttempts:
              $ref: '#/components/examples/TooManyAttempts'
    NotFoundError:
      description: Recurso no encontrado (inexistente o de otra organización).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              $ref: '#/components/examples/NotFound'
    CrossTenantError:
      description: |
        La operación intenta leer o escribir datos de otra organización.
        Dos textos posibles: escritura directa y referencia de FK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            crossTenantWrite:
              $ref: '#/components/examples/CrossTenantWrite'
            crossTenantRelation:
              $ref: '#/components/examples/CrossTenantRelation'
    OrganizationRequiredError:
      description: Falta la cabecera X-Organization-Id en una ruta de dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            organizationRequired:
              $ref: '#/components/examples/OrganizationRequired'
    OrganizationInvalidError:
      description: La cabecera X-Organization-Id no es un UUID válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            organizationInvalid:
              $ref: '#/components/examples/OrganizationInvalid'
    OrganizationAccessDeniedError:
      description: El usuario no tiene acceso a la organización indicada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            organizationAccessDenied:
              $ref: '#/components/examples/OrganizationAccessDenied'
    OrganizationNotTenantError:
      description: La organización indicada no es de tipo cliente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            organizationNotTenant:
              $ref: '#/components/examples/OrganizationNotTenant'
    ForbiddenError:
      description: |
        Permiso insuficiente (policy). Fuera del catálogo: la respuesta
        puede no incluir `code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbiddenPolicy:
              $ref: '#/components/examples/ForbiddenPolicy'
    ServiceUnavailable:
      description: |
        Servicio temporalmente no disponible. Fuera del catálogo: la
        respuesta puede no incluir `code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serviceUnavailable:
              $ref: '#/components/examples/ServiceUnavailableExample'

  schemas:
    AdministrationPermissionKey:
      type: string
      enum: [plants.view, locations.view_all, plants.manage, users.manage, roles.manage, memberships.manage, checklists.view, checklists.manage, norms.view, norms.manage, inspections.manage, inspections.execute, findings.register, findings.close, corrective_actions.manage, corrective_actions.verify, reports.view, reports.view_own]
    AdministrationRole:
      type: object
      required: [id, name, description, system_key, status, permissions, users_count]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 50}
        description: {type: string, nullable: true}
        system_key: {type: string, nullable: true}
        status: {type: boolean}
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdministrationPermissionKey'
        users_count: {type: integer, minimum: 0, description: Número de membresías activas asignadas.}
    AdministrationRoleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdministrationRole'
    AdministrationRolesResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdministrationRole'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    AdministrationRoleCreateInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        description: {type: string, nullable: true, maxLength: 2000}
    AdministrationRoleUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        description: {type: string, nullable: true, maxLength: 2000}
    AdministrationRoleStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: boolean}
    AdministrationRolePermissionsInput:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          uniqueItems: true
          maxItems: 18
          items:
            $ref: '#/components/schemas/AdministrationPermissionKey'
    AdministrationPermissionsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [key, assignable]
            properties:
              key:
                $ref: '#/components/schemas/AdministrationPermissionKey'
              assignable: {type: boolean}
    AdministrationUserRolesInput:
      type: object
      additionalProperties: false
      required: [role_ids]
      properties:
        role_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}

    AdministrationUserLocationsInput:
      type: object
      additionalProperties: false
      required:
        - plant_ids
        - area_ids
      properties:
        plant_ids:
          type: array
          description: |
            Identificadores de las plantas asignadas directamente
            al usuario dentro de la organización activa.
            Un arreglo vacío retira todas las asignaciones
            directas de plantas.
          uniqueItems: true
          items:
            type: string
            format: uuid
        area_ids:
          type: array
          description: |
            Identificadores de las áreas asignadas directamente
            al usuario dentro de la organización activa.
            No requiere asignar previamente la planta padre.
            Un arreglo vacío retira todas las asignaciones
            directas de áreas.
          uniqueItems: true
          items:
            type: string
            format: uuid
    AdministrationMembership:
      type: object
      required:
      - id
      - status
      - revoked_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
          - revoked
        revoked_at:
          type: string
          format: date-time
          nullable: true
    AdministrationUserRole:
      type: object
      required:
      - id
      - name
      - system_key
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        system_key:
          type: string
          nullable: true
        status:
          type: boolean
    AdministrationUserPlant:
      type: object
      required:
      - id
      - name
      - code
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          type: boolean
    AdministrationUserArea:
      type: object
      required:
      - id
      - name
      - code
      - status
      - plant_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          type: boolean
        plant_id:
          type: string
          format: uuid
    AdministrationUserLocations:
      type: object
      required:
      - plants
      - areas
      properties:
        plants:
          type: array
          items:
            $ref: '#/components/schemas/AdministrationUserPlant'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AdministrationUserArea'
      description: Asignaciones visibles según plants.view y alcance del actor. Un arreglo vacío no garantiza ausencia
        de asignaciones.
    AdministrationUser:
      type: object
      required:
      - id
      - name
      - email
      - account_status
      - membership
      - roles
      - locations
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        account_status:
          type: boolean
        membership:
          $ref: '#/components/schemas/AdministrationMembership'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AdministrationUserRole'
        locations:
          $ref: '#/components/schemas/AdministrationUserLocations'
    AdministrationUserResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AdministrationUser'
    AdministrationUsersResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdministrationUser'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    AdministrationUserCreateInput:
      type: object
      required:
      - name
      - email
      - password
      - password_confirmation
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: Al menos una mayúscula, una minúscula y un número; máximo 72 bytes, sin NUL.
        password_confirmation:
          type: string
          format: password
          writeOnly: true
          description: Debe coincidir con password.
      additionalProperties: false
    AdministrationMembershipStatusInput:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - active
          - revoked
      additionalProperties: false

    ReportPeriod:
      type: object
      required:
        - date_from
        - date_to
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
    ReportFilters:
      type: object
      required:
        - plant_id
        - area_id
        - production_line_id
      properties:
        plant_id:
          type: string
          format: uuid
          nullable: true
        area_id:
          type: string
          format: uuid
          nullable: true
        production_line_id:
          type: string
          format: uuid
          nullable: true
    ReportCapabilities:
      type: object
      required:
        - inspections
        - incidents
        - corrective_actions
      properties:
        inspections:
          type: boolean
        incidents:
          type: boolean
        corrective_actions:
          type: boolean
    ReportInspectionStatistics:
      type: object
      required:
        - total
        - finalized
        - reviewed
        - completion_rate
        - approval_rate
        - by_status
      properties:
        total:
          type: integer
          minimum: 0
        finalized:
          type: integer
          minimum: 0
        reviewed:
          type: integer
          minimum: 0
        completion_rate:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        approval_rate:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        by_status:
          type: object
          required:
            - draft
            - completed
            - confirmed
            - rejected
          properties:
            draft:
              type: integer
              minimum: 0
            completed:
              type: integer
              minimum: 0
            confirmed:
              type: integer
              minimum: 0
            rejected:
              type: integer
              minimum: 0
      nullable: true
    ReportIncidentArea:
      type: object
      required:
        - area_id
        - area_name
        - count
        - percentage
      properties:
        area_id:
          type: string
          format: uuid
          nullable: true
        area_name:
          type: string
        count:
          type: integer
          minimum: 0
        percentage:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
    ReportIncidentStatistics:
      type: object
      required:
        - total
        - critical
        - open
        - resolved
        - by_status
        - by_risk_level
        - by_area
      properties:
        total:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        open:
          type: integer
          minimum: 0
        resolved:
          type: integer
          minimum: 0
        by_status:
          type: object
          required:
            - open
            - in_progress
            - resolved
            - closed
          properties:
            open:
              type: integer
              minimum: 0
            in_progress:
              type: integer
              minimum: 0
            resolved:
              type: integer
              minimum: 0
            closed:
              type: integer
              minimum: 0
        by_risk_level:
          type: object
          required:
            - low
            - medium
            - high
            - critical
          properties:
            low:
              type: integer
              minimum: 0
            medium:
              type: integer
              minimum: 0
            high:
              type: integer
              minimum: 0
            critical:
              type: integer
              minimum: 0
        by_area:
          type: array
          items:
            $ref: '#/components/schemas/ReportIncidentArea'
      nullable: true
    ReportCorrectiveActionStatistics:
      type: object
      required:
        - total
        - verified
        - pending
        - overdue
        - verification_rate
        - by_status
      properties:
        total:
          type: integer
          minimum: 0
        verified:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        overdue:
          type: integer
          minimum: 0
        verification_rate:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        by_status:
          type: object
          required:
            - pending
            - in_progress
            - completed
            - verified
          properties:
            pending:
              type: integer
              minimum: 0
            in_progress:
              type: integer
              minimum: 0
            completed:
              type: integer
              minimum: 0
            verified:
              type: integer
              minimum: 0
      nullable: true
    ReportSummaryResponse:
      type: object
      required:
        - organization_id
        - period
        - filters
        - scope
        - capabilities
        - inspections
        - incidents
        - corrective_actions
      properties:
        organization_id:
          type: string
          format: uuid
        period:
          $ref: '#/components/schemas/ReportPeriod'
        filters:
          $ref: '#/components/schemas/ReportFilters'
        scope:
          type: string
          enum:
            - all
            - own
        capabilities:
          $ref: '#/components/schemas/ReportCapabilities'
        inspections:
          $ref: '#/components/schemas/ReportInspectionStatistics'
        incidents:
          $ref: '#/components/schemas/ReportIncidentStatistics'
        corrective_actions:
          $ref: '#/components/schemas/ReportCorrectiveActionStatistics'

    DashboardResponse:
      type: object
      required:
        - organization_id
        - period
        - capabilities
        - summary
        - charts
        - recent_inspections
        - pending_corrective_actions
      properties:
        organization_id:
          type: string
          format: uuid
        period:
          $ref: '#/components/schemas/DashboardPeriod'
        capabilities:
          $ref: '#/components/schemas/DashboardCapabilities'
        summary:
          oneOf:
            - $ref: '#/components/schemas/DashboardSummary'
            - type: array
              maxItems: 0
              items:
                type: object
        charts:
          oneOf:
            - $ref: '#/components/schemas/DashboardCharts'
            - type: array
              maxItems: 0
              items:
                type: object
        recent_inspections:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/DashboardRecentInspection'
        pending_corrective_actions:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/DashboardPendingAction'

    DashboardPeriod:
      type: object
      required:
        - month
        - granularity
        - date_from
        - date_to
        - previous_date_from
        - previous_date_to
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: '2026-11'
        granularity:
          type: string
          enum:
            - weekly
            - monthly
            - yearly
          description: Agrupación aplicada a la tendencia de aprobación.
          example: monthly
        date_from:
          type: string
          format: date
          description: Primer día del mes seleccionado.
          example: '2026-11-01'
        date_to:
          type: string
          format: date
          description: Último día del mes seleccionado.
          example: '2026-11-30'
        previous_date_from:
          type: string
          format: date
          description: Primer día del mes anterior.
          example: '2026-10-01'
        previous_date_to:
          type: string
          format: date
          description: Último día del mes anterior.
          example: '2026-10-31'
          
    DashboardCapabilities:
      type: object
      required:
        - inspections
        - incidents
        - corrective_actions
        - create_inspection
      properties:
        inspections:
          type: boolean
        incidents:
          type: boolean
        corrective_actions:
          type: boolean
        create_inspection:
          type: boolean
    DashboardSummary:
      type: object
      properties:
        approval_rate:
          $ref: '#/components/schemas/DashboardApprovalRate'
        inspections:
          $ref: '#/components/schemas/DashboardInspectionCount'
        open_incidents:
          $ref: '#/components/schemas/DashboardOpenIncidents'
        pending_corrective_actions:
          $ref: '#/components/schemas/DashboardPendingActionCount'
      description: Las propiedades no autorizadas se omiten; sin permisos se devuelve un arreglo vacío.
    DashboardApprovalRate:
      type: object
      required:
        - value
        - previous_value
        - change
        - approved
        - rejected
        - reviewed
      properties:
        value:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        previous_value:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        change:
          type: number
          nullable: true
          description: Diferencia en puntos porcentuales.
        approved:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        reviewed:
          type: integer
          minimum: 0
    DashboardInspectionCount:
      type: object
      required:
        - value
        - previous_value
        - change
      properties:
        value:
          type: integer
          minimum: 0
        previous_value:
          type: integer
          minimum: 0
        change:
          type: integer
    DashboardOpenIncidents:
      type: object
      required:
        - value
        - critical
      properties:
        value:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
    DashboardPendingActionCount:
      type: object
      required:
        - value
        - overdue
      properties:
        value:
          type: integer
          minimum: 0
        overdue:
          type: integer
          minimum: 0
          
    DashboardCharts:
      type: object
      description: |
        Las propiedades no autorizadas se omiten.
        Sin permisos para las gráficas se devuelve un objeto vacío.
      properties:
        approval_trend:
          type: array
          minItems: 4
          maxItems: 5
          description: |
