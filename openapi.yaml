          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ValidationFailed'
                inactiveArea:
                  value:
                    message: The given data was invalid.
                    code: validation_failed
                    errors:
                      areaId:
                        - El área está inactiva.
                inactivePlant:
                  value:
                    message: The given data was invalid.
                    code: validation_failed
                    errors:
                      plantId:
                        - La planta está inactiva.
                duplicateCode:
                  value:
                    message: The given data was invalid.
                    code: validation_failed
                    errors:
                      code:
                        - El código ya está en uso.
