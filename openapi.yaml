          $ref: '#/components/responses/NotFoundError'
        '415':
          description: El Content-Type no es application/json; también se rechaza multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            JSON inválido, propiedades extra, parámetros query, datos inválidos,
            área o planta propia inactiva o código duplicado en el área. El área
            inactiva se identifica en errors.areaId; la planta inactiva en
