  /inspections/{inspectionId}/checklist:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Checklist histórico de la inspección
      description: |
        Devuelve el checklist **congelado** en
        `inspections.checklist_version_id`: la versión usada al crear la
        inspección, no la versión publicada actual.

        - No depende del estado actual del checklist, de la versión, de las
          normas ni de los requerimientos: una versión archivada, un checklist
          desactivado o una norma inactiva siguen siendo legibles.
        - Solo incluye preguntas con `status = true` de la versión original.
          Las preguntas inactive se omiten; no se mezclan preguntas de otras
          versiones.
        - `supported` indica si el tipo puede escribirse mediante la API de
          respuestas (INS-02): `boolean`, `text`, `number`, `date` y
          `multiple_choice` son `true`; `signature` es `false` y permanece
          visible solo como contenido histórico de lectura.
        - No requiere `checklists.view` ni `norms.view`; la autorización es la
          de la inspección (`inspections.execute` o `inspections.manage`,
          membresía activa y asignación vigente a la planta o área).
        - Las inspecciones ajenas solo son visibles con `inspections.manage`.
          `locations.view_all` no sustituye la asignación.
        - Autorización fallida sobre una inspección inexistente o de otra
          organización responde 404; una inspección visible pero no autorizada
          responde 403.

        El DTO se ordena por `display_order` e `id` de secciones y preguntas, y
        los requerimientos normativos por `code` e `id`. La operación es de
        solo lectura y no modifica datos ni auditoría.
      tags:
        - Inspections
      parameters:
        - $ref: '#/components/parameters/inspectionIdParam'
      responses:
        '200':
          description: Checklist histórico de la versión usada por la inspección.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/InspectionChecklist'
        '400':
          description: Contexto de organización inválido (organization_required u organization_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizationRequired:
                  $ref: '#/components/examples/OrganizationRequired'
                organizationInvalid:
                  $ref: '#/components/examples/OrganizationInvalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Sin acceso: usuario inactivo, organización no accesible o permiso
            insuficiente (las policies pueden responder 403 sin code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userInactive:
                  $ref: '#/components/examples/UserInactive'
                organizationAccessDenied:
                  $ref: '#/components/examples/OrganizationAccessDenied'
                organizationNotTenant:
                  $ref: '#/components/examples/OrganizationNotTenant'
                forbiddenPolicy:
                  $ref: '#/components/examples/ForbiddenPolicy'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /inspections/{inspectionId}/answers:
    parameters:
      - $ref: '#/components/parameters/organizationIdHeader'
    get:
      summary: Listar respuestas de la inspección
      description: |
        Lista paginada de respuestas de una inspección visible para el usuario.

        - Lectura permitida al propietario con `inspections.execute` y a
          cualquier usuario con `inspections.manage`; en ambos casos se exige
          membresía activa y asignación vigente a la planta o área. Las
          inspecciones ajenas sin `manage` responden 404. `locations.view_all`
          no sustituye la asignación.
        - No se exige `checklists.view` ni `norms.view`.
        - Orden ascendente por `created_at` e `id`. `per_page` predeterminado
          100 y máximo 100; `page` inicia en 1.
        - Parámetros de consulta desconocidos, `page` inválido o `per_page`
          fuera de rango responden 422 con `validation_failed`.
        - La visibilidad del recurso se resuelve antes de validar la
          paginación: una inspección no visible responde 404 con independencia
          de los parámetros de consulta.
        - La lectura no modifica datos ni auditoría y funciona en cualquier
          estado de la inspección.
        - Este contrato no implementa sincronización offline ni idempotencia de
          red; la PWA anterior no es compatible con esta superficie.
      tags:
        - Inspections
      parameters:
        - $ref: '#/components/parameters/inspectionIdParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/answersPerPageParam'
      responses:
        '200':
          description: Respuestas de la inspección.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
